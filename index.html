function Field({ label, value, onChange, type = "text", options, full, error }) {
  return (
    <div style={{ gridColumn: full ? "1 / -1" : "auto" }}>
      <div style={{ fontSize: 11, color: "#9C9284", marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.4 }}>{label}</div>
      {type === "select" ? (
        <select value={value} onChange={(e) => onChange(e.target.value)} style={styles.input}>
          {options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      ) : (
        <input type={type} value={value} onChange={(e) => onChange(e.target.value)}
          style={{ ...styles.input, ...(error ? { border: "1px solid #A99790" } : {}) }} />
      )}
      {error && <div style={{ fontSize: 11.5, color: "#A99790", marginTop: 4 }}>{error}</div>}
    </div>
  );
}

function Agenda({ patients, events, onAdd, onUpdate, onDelete }) {
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [ordenacaoAgenda, setOrdenacaoAgenda] = useState("horario");

  const patientName = (id) => patients.find((p) => p.id === id)?.nome || "—";

  const ordenados = [...events].sort((a, b) => (a.data + (a.hora || "")).localeCompare(b.data + (b.hora || "")));
  const porData = ordenados.reduce((acc, e) => {
    acc[e.data] = acc[e.data] || [];
    acc[e.data].push(e);
    return acc;
  }, {});
  if (ordenacaoAgenda === "nome") {
    Object.keys(porData).forEach((data) => {
      porData[data].sort((a, b) => patientName(a.pacienteId).localeCompare(patientName(b.pacienteId), "pt-BR"));
    });
  }

  return (
    <div>
      <SectionTitle
        title="Agenda"
        subtitle="Consultas e retornos por data"
        action={
          <button style={styles.primaryBtn} onClick={() => { setEditing(null); setShowModal(true); }}>
            <Plus size={16} /> Novo agendamento
          </button>
        }
      />
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <span style={{ fontSize: 12, color: "#9C9284", fontWeight: 600 }}>Ordenar por:</span>
        {[
          { id: "horario", label: "Horário" },
          { id: "nome", label: "Ordem alfabética" }
        ].map((o) => (
          <button
            key={o.id}
            onClick={() => setOrdenacaoAgenda(o.id)}
            style={{
              padding: "5px 12px", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${ordenacaoAgenda === o.id ? "#918567" : "#E3DACB"}`,
              background: ordenacaoAgenda === o.id ? "#EFE6D8" : "#FFFFFF",
              color: ordenacaoAgenda === o.id ? "#867A6E" : "#9C9284"
            }}
          >
            {o.label}
          </button>
        ))}
      </div>
      <div style={styles.panel}>
        {Object.keys(porData).length === 0 && <div style={styles.emptyRow}>Nenhum evento agendado.</div>}
        {Object.entries(porData).map(([data, lista]) => (
          <div key={data} style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#867A6E", marginBottom: 8 }}>
              {new Date(data + "T00:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" })}
            </div>
            {lista.map((e) => (
              <div key={e.id} style={styles.agendaRow} className="agenda-row">
                <Calendar size={15} color={EVENT_STATUS_COLOR[e.status]} />
                <div className="agenda-name" style={{ fontWeight: 600, color: "#867A6E", width: 180 }}>
                  {patientName(e.pacienteId)}
                  {e.hora && <span style={{ color: "#9C9284", fontWeight: 400 }}> · {e.hora}</span>}
                </div>
                <div style={{ fontSize: 13, color: "#6E6355" }}>{e.tipo}</div>
                <span style={{
                  fontSize: 11, fontWeight: 600, padding: "3px 9px", borderRadius: 20,
                  background: EVENT_STATUS_COLOR[e.status] + "1F", color: EVENT_STATUS_COLOR[e.status]
                }}>
                  {EVENT_STATUS_LABEL[e.status]}
                </span>
                <div style={{ display: "flex", gap: 4, marginLeft: "auto" }}>
                  {e.status === "agendado" && (
                    <button
                      title="Marcar como realizado"
                      onClick={() => {
                        if (window.confirm(`Confirmar que a consulta de ${patientName(e.pacienteId)} foi realizada?`)) {
                          onUpdate(e.id, { status: "realizado" });
                        }
                      }}
                      style={{ background: "#EFE6D8", border: "none", borderRadius: 6, padding: 5, display: "flex", color: "#918567", cursor: "pointer" }}
                    >
                      <CheckCircle2 size={13} />
                    </button>
                  )}
                  <button
                    title="Editar"
                    onClick={() => { setEditing(e); setShowModal(true); }}
                    style={{ background: "#EFE6D8", border: "none", borderRadius: 6, padding: 5, display: "flex", color: "#6E6355", cursor: "pointer" }}
                  >
                    <Pencil size={13} />
                  </button>
                  <button
                    title="Excluir"
                    onClick={() => { if (window.confirm("Excluir este agendamento? Essa ação não pode ser desfeita.")) onDelete(e.id); }}
                    style={{ background: "#EFE6D8", border: "none", borderRadius: 6, padding: 5, display: "flex", color: "#A99790", cursor: "pointer" }}
                  >
                    <Trash2 size={13} />
                  </button>
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>

      {showModal && (
        <EventModal
          patients={patients}
          event={editing}
          onClose={() => setShowModal(false)}
          onSave={(ev) => {
            if (editing) onUpdate(editing.id, ev);
            else onAdd(ev);
            setShowModal(false);
          }}
        />
      )}
    </div>
  );
}

function FollowupsBoard({ followups, patients, onMove, onAdd, onDelete, onCriarProspeccao }) {

  const patientName = (id) => patientOf(id)?.nome || "—";
  const mensagemReativacao = (p) =>
    `Oiê ${p?.responsavel || ""}! Passando para saber se ainda tem interesse em agendar aquela conversa sobre a alimentação da ${p?.nome || ""}. Continuo à disposição quando quiser retomar! 💛`;
  const mensagemConsultaAtrasada = (p) =>
    `Oiê ${p?.responsavel || ""}! Passando para saber se conseguiu pensar em um horário para o retorno da ${p?.nome || ""}. Qualquer horário, me avisa! 💛`;
  const mensagemPara = (f, p) => (f.tipo === "Consulta atrasada" ? mensagemConsultaAtrasada(p) : mensagemReativacao(p));

  const contagemProspeccao = followups.filter((f) => patientOf(f.pacienteId)?.status === "prospect").length;
  const contagemAtrasadas = followups.length - contagemProspeccao;
  const followupsFiltrados = followups.filter((f) => {
    const ehProspeccao = patientOf(f.pacienteId)?.status === "prospect";
    return aba === "prospeccao" ? ehProspeccao : !ehProspeccao;
  });

  return (
    <div>

        subtitle="Tarefas de relacionamento e cobrança"

            </button>

              <Plus size={16} /> Novo follow-up
            </button>
          </div>
        }
      />
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {[
          { id: "atrasadas", label: "Consultas atrasadas", count: contagemAtrasadas },

            key={t.id}
            onClick={() => setAba(t.id)}
            style={{

              background: aba === t.id ? "#867A6E" : "#FFFFFF",

      <div style={{ display: "flex", gap: 14, overflowX: "auto", paddingBottom: 8 }}>
        {KANBAN_COLS.map((col) => {
          const items = followupsFiltrados.filter((f) => f.coluna === col.id);

              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {items.map((f) => {
                  const paciente = patientOf(f.pacienteId);
                  const linkWpp = paciente ? linkWhatsApp(paciente.whatsapp || paciente.telefone, f.mensagemSugerida || mensagemPara(f, paciente)) : null;
                  return (
                    <div key={f.id} style={styles.kanbanCard}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: "#867A6E" }}>{f.titulo}</div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span style={{ width: 8, height: 8, borderRadius: 8, background: PRIORIDADE_COLOR[f.prioridade], marginTop: 4 }} />
                          <button
                            title="Excluir follow-up"
                            onClick={() => { if (window.confirm("Excluir este follow-up? Essa ação não pode ser desfeita.")) onDelete(f.id); }}
                            style={{ background: "none", border: "none", color: "#CFC7B6", cursor: "pointer", padding: 0, display: "flex" }}
                          >
                            <Trash2 size={13} />
                          </button>
                        </div>
                      </div>
                      <div style={{ fontSize: 12, color: "#9C9284", marginTop: 4 }}>{patientName(f.pacienteId)}</div>
                      <div style={{ fontSize: 11, color: "#9C9284", marginTop: 6 }}>

                      )}
                      <select
                        value={f.coluna}

                      >

                      </select>
                    </div>

                })}
                {items.length === 0 && <div style={{ fontSize: 12, color: "#C9BFAE", padding: "8px 0" }}>Sem tarefas</div>}

function Financeiro({ patients, onAddPagamento }) {
  const [paymentTarget, setPaymentTarget] = useState(null);

  const rows = patients.filter((p) => p.status !== "prospect").map((p) => {
    const pagamentos = p.pagamentos || [];
    const recebidoPlano = pagamentos.filter((pg) => pg.tipo !== "avulso").reduce((s, pg) => s + pg.valor, 0);
    const recebidoAvulso = pagamentos.filter((pg) => pg.tipo === "avulso").reduce((s, pg) => s + pg.valor, 0);
    const previsto = p.acompanhamento?.valor || 0;
    const pendente = Math.max(0, previsto - recebidoPlano);
    return { ...p, recebidoPlano, recebidoAvulso, recebidoTotal: recebidoPlano + recebidoAvulso, pendente };
  });

  const totalPrevisto = rows.reduce((s, r) => s + (r.acompanhamento?.valor || 0), 0);
  const totalRecebido = rows.reduce((s, r) => s + r.recebidoTotal, 0);
  const totalPendente = rows.reduce((s, r) => s + r.pendente, 0);

  const todosPagamentos = rows
    .flatMap((r) => (r.pagamentos || []).map((pg) => ({ ...pg, pacienteNome: r.nome })))
    .sort((a, b) => new Date(b.data) - new Date(a.data))
    .slice(0, 8);

  return (
    <div>
      <SectionTitle title="Financeiro" subtitle="Planos, pagamentos e inadimplência"
        action={
          <button style={styles.primaryBtn} onClick={() => rows[0] && setPaymentTarget({ patientId: rows[0].id, mode: "avulso" })}>
            <Plus size={16} /> Cobrança avulsa
          </button>
        }
      />
      <div style={styles.cardsGrid} className="cards-grid">
        <MetricCard label="Receita prevista" value={formatMoeda(totalPrevisto)} icon={DollarSign} accent="#867A6E" />
        <MetricCard label="Receita recebida" value={formatMoeda(totalRecebido)} icon={TrendingUp} accent="#918567" />
        <MetricCard label="Receita pendente" value={formatMoeda(totalPendente)} icon={AlertTriangle} accent="#AFA998" />
      </div>
      <div style={styles.panel}>
        <div style={styles.tableHeader} className="table-header">
          <div style={{ flex: 2 }}>Paciente</div>
          <div style={{ flex: 1 }}>Plano</div>
          <div style={{ flex: 1 }}>Pagamento</div>
          <div style={{ flex: 1 }}>Recebido</div>
          <div style={{ flex: 1 }}>Pendente</div>
          <div style={{ flex: 1 }}>Status</div>
          <div style={{ width: 36 }} />
        </div>
        {rows.map((r) => (
          <div key={r.id} style={styles.tableRow} className="table-row">
            <div style={{ flex: 2, fontWeight: 600, color: "#867A6E" }}>{r.nome}</div>
            <div style={{ flex: 1, fontSize: 13, color: "#6E6355" }} data-label="Plano">{r.acompanhamento?.tipo}</div>
            <div style={{ flex: 1, fontSize: 13, color: "#6E6355" }} data-label="Pagamento">{r.acompanhamento?.formaPagamento} · {r.acompanhamento?.parcelas}x</div>
            <div style={{ flex: 1, fontSize: 13, color: "#918567", fontWeight: 600 }} data-label="Recebido">{formatMoeda(r.recebidoTotal)}</div>
            <div style={{ flex: 1, fontSize: 13, color: "#A99790", fontWeight: 600 }} data-label="Pendente">{formatMoeda(r.pendente)}</div>
            <div style={{ flex: 1 }} data-label="Status"><StatusPill status={r.status} /></div>
            <div style={{ width: 36 }} onClick={(e) => e.stopPropagation()}>
              {r.pendente > 0 && (
                <button title="Registrar pagamento" onClick={() => setPaymentTarget({ patientId: r.id, mode: "parcela" })}
                  style={{ background: "#EFE6D8", border: "none", borderRadius: 8, padding: 6, display: "flex", color: "#867A6E", cursor: "pointer" }}>
                  <DollarSign size={14} />
                </button>
              )}
            </div>
          </div>
        ))}
      </div>

      {todosPagamentos.length > 0 && (
        <div style={styles.panel}>
          <div style={styles.panelTitle}>Pagamentos recentes</div>
          {todosPagamentos.map((pg) => (
            <div key={pg.id} style={styles.agendaRow} className="agenda-row">
              <DollarSign size={15} color={pg.tipo === "avulso" ? "#AFA998" : "#918567"} />
              <div className="agenda-name" style={{ fontWeight: 600, color: "#867A6E", width: 180 }}>{pg.pacienteNome}</div>
              <div style={{ fontSize: 13, color: "#6E6355" }}>{formatMoeda(pg.valor)} · {pg.formaPagamento}</div>
              <div style={{ fontSize: 12, color: "#9C9284", marginLeft: "auto" }}>{formatData(pg.data)}</div>
            </div>
          ))}
        </div>
      )}

      {paymentTarget && (
        <PaymentModal
          patients={rows}
          target={paymentTarget}
          onClose={() => setPaymentTarget(null)}
          onSave={(patientId, pagamento) => { onAddPagamento(patientId, pagamento); setPaymentTarget(null); }}
        />
      )}
    </div>
  );
}

function Administracao({ patients, contratosModelo, setContratosModelo }) {
  const [tipoAtivo, setTipoAtivo] = useState("introducao_alimentar");
  const [pacienteSelecionadoId, setPacienteSelecionadoId] = useState("");
  const [textoGerado, setTextoGerado] = useState("");

  const salvarModelo = (texto) => {
    setContratosModelo((prev) => ({ ...prev, [tipoAtivo]: texto }));
  };

  const gerarContrato = () => {
    const p = patients.find((pt) => pt.id === pacienteSelecionadoId);
    if (!p) return;
    const acomp = p.acompanhamento || {};
    const tipoId = acomp.tipoId || "avulso";
    const modelo = contratosModelo[tipoId] || CONTRATOS_PADRAO.avulso;
    const duracaoTipo = TIPOS_ACOMPANHAMENTO.find((t) => t.id === tipoId)?.duracaoMeses;
    const texto = modelo
      .split("{{nome}}").join(p.nome || "")
      .split("{{responsavel}}").join(p.responsavel || "")
      .split("{{duracao}}").join(String(duracaoTipo || ""))
      .split("{{dataInicio}}").join(formatData(acomp.dataInicio))
      .split("{{dataFim}}").join(formatData(acomp.dataFim))
      .split("{{valor}}").join(formatMoeda(acomp.valor))
      .split("{{formaPagamento}}").join(acomp.formaPagamento || "")
      .split("{{parcelas}}").join(String(acomp.parcelas || 1));
    setTextoGerado(texto);
  };

  const copiarTexto = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(textoGerado);
  };

  const todosPagamentos = patients
    .flatMap((p) => (p.pagamentos || []).map((pg) => ({ ...pg, pacienteNome: p.nome })))
    .sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  return (
    <div>
      <SectionTitle title="Administração" subtitle="Termos de compromisso e comprovantes de pagamento" />

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Modelos de termo de compromisso</div>
        <div style={{ fontSize: 12, color: "#A99790", marginBottom: 14, lineHeight: 1.6 }}>
          Estes modelos são um ponto de partida editável — não substituem aconselhamento jurídico.
          Recomendamos revisão por um advogado antes de usar com os responsáveis.
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {TIPOS_ACOMPANHAMENTO.map((t) => (
            <button
              key={t.id}
              onClick={() => setTipoAtivo(t.id)}
              style={{
                padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                border: `1px solid ${tipoAtivo === t.id ? "#867A6E" : "#E3DACB"}`,
                background: tipoAtivo === t.id ? "#867A6E" : "#FFFFFF",
                color: tipoAtivo === t.id ? "#FFFFFF" : "#6E6355"
              }}
            >
              {t.label}
            </button>
          ))}
        </div>
        <textarea
          value={contratosModelo[tipoAtivo] || ""}
          onChange={(e) => salvarModelo(e.target.value)}
          style={{ ...styles.input, minHeight: 260, resize: "vertical", fontFamily: "monospace", fontSize: 12.5, lineHeight: 1.6 }}
        />
        <div style={{ fontSize: 11.5, color: "#9C9284", marginTop: 8 }}>
          Use {"{{nome}}"}, {"{{responsavel}}"}, {"{{duracao}}"}, {"{{dataInicio}}"} e {"{{dataFim}}"} —
          são preenchidos automaticamente ao gerar o termo de um paciente.
        </div>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Gerar termo para um paciente</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: 1, minWidth: 220 }}>
            <div style={{ fontSize: 11, color: "#9C9284", marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.4 }}>Paciente</div>
            <select value={pacienteSelecionadoId} onChange={(e) => setPacienteSelecionadoId(e.target.value)} style={styles.input}>
              <option value="">Selecione...</option>
              {patients.filter((p) => p.status !== "prospect").map((p) => (
                <option key={p.id} value={p.id}>{p.nome}</option>
              ))}
            </select>
          </div>
          <button style={styles.primaryBtn} onClick={gerarContrato} disabled={!pacienteSelecionadoId}>Gerar termo</button>
        </div>
        {textoGerado && (
          <div style={{ marginTop: 16 }}>
            <textarea
              readOnly
              value={textoGerado}
              style={{ ...styles.input, minHeight: 260, resize: "vertical", fontFamily: "monospace", fontSize: 12.5, lineHeight: 1.6 }}
            />
            <button style={{ ...styles.secondaryBtn, marginTop: 8 }} onClick={copiarTexto}>Copiar texto</button>
          </div>
        )}
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Comprovantes (pagamentos registrados)</div>
        {todosPagamentos.length === 0 ? (
          <div style={styles.emptyRow}>Nenhum pagamento registrado ainda.</div>
        ) : (
          todosPagamentos.slice(0, 50).map((pg, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid #E3DACB", fontSize: 13 }}>
              <span style={{ color: "#867A6E", fontWeight: 600 }}>{pg.pacienteNome}</span>
              <span style={{ color: "#6E6355" }}>{formatData(pg.data)}</span>
              <span style={{ color: "#918567", fontWeight: 600 }}>{formatMoeda(pg.valor)}</span>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function PaymentModal({ patients, target, onClose, onSave }) {
  const isAvulso = target.mode === "avulso";
  const patientInicial = patients.find((p) => p.id === target.patientId);
  const sugestao = !isAvulso && patientInicial?.acompanhamento?.consultasTotal
    ? Math.round((patientInicial.acompanhamento.valor / patientInicial.acompanhamento.consultasTotal) * 100) / 100
    : "";

  const [patientId, setPatientId] = useState(target.patientId || patients[0]?.id || "");
  const [valor, setValor] = useState(sugestao);
  const [data, setData] = useState(new Date().toISOString().slice(0, 10));
  const [forma, setForma] = useState(patientInicial?.acompanhamento?.formaPagamento || "Pix");
  const [obs, setObs] = useState("");

  const submit = () => {
    if (!patientId || !valor || Number(valor) <= 0) return;
    onSave(patientId, { id: uid(), data, valor: Number(valor), formaPagamento: forma, tipo: isAvulso ? "avulso" : "parcela", obs });
  };

  return (
    <div style={styles.overlay} onClick={onClose}>
      <div style={{ ...styles.modal, width: 420 }} className="modal" onClick={(e) => e.stopPropagation()}>
        <div style={styles.drawerHeader} className="drawer-header">
          <div style={{ fontFamily: "Playfair Display, serif", fontSize: 18, fontWeight: 600, color: "#867A6E" }}>
            {isAvulso ? "Cobrança avulsa" : "Registrar pagamento"}
          </div>
          <button style={styles.iconBtn} onClick={onClose}><X size={18} /></button>
        </div>
        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 12 }}>
          {isAvulso && (
            <Field label="Paciente" type="select" options={patients.map((p) => p.nome)}
              value={patients.find((p) => p.id === patientId)?.nome || ""}
              onChange={(nome) => setPatientId(patients.find((p) => p.nome === nome)?.id)} />
          )}
          <Field label="Valor (R$)" type="number" value={valor} onChange={setValor} />
          <Field label="Data" type="date" value={data} onChange={setData} />
          <Field label="Forma de pagamento" type="select" options={["Pix", "Cartão", "Boleto", "Dinheiro"]} value={forma} onChange={setForma} />
          {isAvulso && <Field label="Descrição (opcional)" value={obs} onChange={setObs} />}
        </div>
        <div className="modal-footer" style={{ padding: "16px 20px", borderTop: "1px solid #E3DACB", display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <button style={styles.secondaryBtn} onClick={onClose}>Cancelar</button>
          <button style={styles.primaryBtn} onClick={submit}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

function Integracoes({
  googleClientId, setGoogleClientId, googleToken, gisReady, onConectar, onDesconectar, onSincronizarTudo, syncLog,
  onResetarBase, onSugerirTipos, patients, followups, events, setPatients, setFollowups, setEvents
}) {
  const [inputId, setInputId] = useState(googleClientId);
  const [sincronizando, setSincronizando] = useState(false);
  const backupInputRef = useRef(null);

  const salvarClientId = () => setGoogleClientId(inputId.trim());

  const handleSincronizar = async () => {
    setSincronizando(true);
    await onSincronizarTudo();
    setSincronizando(false);
  };

  const exportarBackupJSON = () => {
    const backup = { patients, followups, events, exportadoEm: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backup_crm_barbara_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importarBackupJSON = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.patients) { window.alert("Arquivo inválido: não parece ser um backup deste CRM."); return; }
        const confirmar = window.confirm(
          `Esse backup tem ${data.patients.length} paciente(s), ${(data.followups || []).length} follow-up(s) e ` +
          `${(data.events || []).length} evento(s) de agenda.\n\nIsso vai SUBSTITUIR todos os dados atuais. Deseja continuar?`
        );
        if (!confirmar) return;
        setPatients(data.patients || []);
        setFollowups(data.followups || []);
        setEvents(data.events || []);
        window.alert("Backup restaurado com sucesso.");
      } catch (err) {
        window.alert("Não foi possível ler o arquivo. Confira se é um backup válido (.json) gerado por este CRM.");
      }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <SectionTitle title="Integrações" subtitle="Sincronização automática com a Google Agenda" />

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Backup completo</div>
        <div style={{ fontSize: 13, color: "#4B615D", lineHeight: 1.7, marginBottom: 12 }}>
          Baixe um arquivo com todos os pacientes, agenda e follow-ups para guardar em outro lugar (e-mail, Drive, etc.).
          Se o navegador limpar os dados ou você trocar de aparelho, é só importar esse arquivo de volta.
        </div>
        <input
          type="file" accept=".json" ref={backupInputRef} style={{ display: "none" }}
          onChange={(e) => { const f = e.target.files[0]; if (f) importarBackupJSON(f); e.target.value = ""; }}
        />
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button style={styles.secondaryBtn} onClick={exportarBackupJSON}>
            <FileText size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Baixar backup (.json)
          </button>
          <button style={styles.secondaryBtn} onClick={() => backupInputRef.current.click()}>
            <Upload size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Restaurar backup (.json)
          </button>
        </div>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Classificação em massa</div>
        <div style={{ fontSize: 13, color: "#4B615D", lineHeight: 1.7, marginBottom: 12 }}>
          Sugere automaticamente o tipo de acompanhamento (Introdução Alimentar, Ali(mente) ou Trilhar)
          para pacientes que já têm data de nascimento preenchida e ainda não têm um tipo definido, com base na idade.
          Pacientes já classificados não são alterados.
        </div>
        <button style={styles.secondaryBtn} onClick={onSugerirTipos}>
          <Activity size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Sugerir tipo de acompanhamento por idade
        </button>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Atualizar base de dados</div>
        <div style={{ fontSize: 13, color: "#4B615D", lineHeight: 1.7, marginBottom: 12 }}>
          Sempre que você atualizar os arquivos do CRM no GitHub, o navegador continua mostrando os dados que já
          tinha salvo localmente (isso é normal). Se os pacientes não aparecerem depois de uma atualização, clique
          abaixo para recarregar a base original que vem no arquivo mais recente.
        </div>
        <button style={styles.secondaryBtn} onClick={onResetarBase}>
          <RefreshCw size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Recarregar dados originais do arquivo
        </button>
        <div style={{ fontSize: 11.5, color: "#A99790", marginTop: 8 }}>
          Atenção: isso substitui pacientes, agenda e follow-ups pelos dados originais do arquivo, apagando qualquer
          edição feita depois da última atualização.
        </div>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Status da conexão</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <span style={{ width: 10, height: 10, borderRadius: 10, background: googleToken ? "#918567" : "#CFC7B6" }} />
          <span style={{ fontSize: 14, color: "#16332E", fontWeight: 600 }}>
            {googleToken ? "Conectado à Google Agenda" : "Não conectado"}
          </span>
        </div>

        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, color: "#9C9284", marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.4 }}>
            Client ID do Google Cloud
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              value={inputId}
              onChange={(e) => setInputId(e.target.value)}
              placeholder="xxxxxxxxxxxx.apps.googleusercontent.com"
              style={{ ...styles.input, flex: 1, minWidth: 220 }}
            />
            <button style={styles.secondaryBtn} onClick={salvarClientId}>Salvar</button>
          </div>
        </div>

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          {!googleToken ? (
            <button style={styles.primaryBtn} disabled={!gisReady || !googleClientId} onClick={onConectar}>
              <Link2 size={14} style={{ marginRight: 6, verticalAlign: -2 }} />
              {!googleClientId ? "Salve o Client ID primeiro" : gisReady ? "Conectar com Google Agenda" : "Carregando..."}
            </button>
          ) : (
            <>
              <button style={styles.primaryBtn} onClick={handleSincronizar} disabled={sincronizando}>
                <RefreshCw size={14} style={{ marginRight: 6, verticalAlign: -2 }} />
                {sincronizando ? "Sincronizando..." : "Sincronizar tudo agora"}
              </button>
              <button style={styles.secondaryBtn} onClick={onDesconectar}>Desconectar</button>
            </>
          )}
        </div>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Como conectar (passo a passo, uma única vez)</div>
        <ol style={{ fontSize: 13, color: "#4B615D", lineHeight: 1.9, paddingLeft: 20, margin: 0 }}>
          <li>Acesse o <strong>Google Cloud Console</strong> (console.cloud.google.com) e crie um projeto novo (gratuito).</li>
          <li>No menu, vá em <strong>APIs e serviços → Biblioteca</strong>, procure "Google Calendar API" e clique em Ativar.</li>
          <li>Vá em <strong>APIs e serviços → Tela de consentimento OAuth</strong>: escolha "Externo", preencha nome do app e seu e-mail, e adicione seu e-mail como "usuário de teste".</li>
          <li>Vá em <strong>APIs e serviços → Credenciais → Criar credenciais → ID do cliente OAuth</strong>. Tipo: "Aplicativo da Web".</li>
          <li>Em "Origens JavaScript autorizadas", adicione o endereço onde este CRM está publicado (ex: <code>https://seuusuario.github.io</code>).</li>
          <li>Copie o "Client ID" gerado (termina em <code>.apps.googleusercontent.com</code>) e cole no campo acima.</li>
        </ol>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>O que é sincronizado automaticamente</div>
        <ul style={{ fontSize: 13, color: "#4B615D", lineHeight: 1.9, paddingLeft: 20, margin: 0 }}>
          <li>Todo novo agendamento criado na Agenda → vira um evento no Google Agenda, com lembretes 1h e 1 dia antes.</li>
          <li>Editar ou excluir um agendamento → atualiza ou remove o evento correspondente no Google.</li>
          <li>Todo novo follow-up criado → vira um evento às 9h no dia do prazo, com lembrete 1h antes.</li>
          <li>Marcar um follow-up como "Concluído" → remove o lembrete do Google Agenda automaticamente.</li>
        </ul>
        <div style={{ fontSize: 12, color: "#9C9284", marginTop: 10 }}>
          A conexão dura algumas horas por sessão — se parar de sincronizar, basta clicar em "Conectar com Google Agenda" de novo.
        </div>
      </div>

      {syncLog.length > 0 && (
        <div style={styles.panel}>
          <div style={styles.panelTitle}>Atividade recente</div>
          {syncLog.map((l) => (
            <div key={l.id} style={{ display: "flex", gap: 10, padding: "8px 0", borderBottom: "1px solid #E3DACB", fontSize: 13 }}>
              <span style={{ color: l.ok ? "#918567" : "#A99790" }}>{l.ok ? "✓" : "✕"}</span>
              <span style={{ color: "#4B615D", flex: 1 }}>{l.msg}</span>
              <span style={{ color: "#9C9284", fontSize: 11, flexShrink: 0 }}>{new Date(l.quando).toLocaleTimeString("pt-BR")}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
