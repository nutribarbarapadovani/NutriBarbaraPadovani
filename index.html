const uid = () => Math.random().toString(36).slice(2, 10);

const calcIdade = (nasc) => {
  if (!nasc) return "-";
  const hoje = new Date();
  const n = new Date(nasc);
  let anos = hoje.getFullYear() - n.getFullYear();
  let meses = hoje.getMonth() - n.getMonth();
  if (hoje.getDate() < n.getDate()) meses--;
  if (meses < 0) { anos--; meses += 12; }
  if (anos < 1) return `${meses}m`;
  return `${anos}a ${meses}m`;
};

const calcIMC = (peso, alturaCm) => {
  if (!peso || !alturaCm) return "-";
  const alturaM = alturaCm / 100;
  return (peso / (alturaM * alturaM)).toFixed(1);
};

const formatMoeda = (v) =>

const formatData = (d) => {
  if (!d) return "-";
  return new Date(d + "T00:00:00").toLocaleDateString("pt-BR");
};

const diasDesde = (d) => {
  if (!d) return null;
  const diff = Date.now() - new Date(d).getTime();
  return Math.floor(diff / (1000 * 60 * 60 * 24));
};

const addMesesData = (dataStr, meses) => {
  if (!dataStr) return "";
  const d = new Date(dataStr + "T00:00:00");
  const inteiros = Math.floor(meses);
  const fracao = meses - inteiros;
  d.setMonth(d.getMonth() + inteiros);
  if (fracao) d.setDate(d.getDate() + Math.round(fracao * 30));
  return d.toISOString().slice(0, 10);
};

const dataNascimentoDeIdade = (anos, meses) => {
  const hoje = new Date();
  hoje.setFullYear(hoje.getFullYear() - (Number(anos) || 0));
  hoje.setMonth(hoje.getMonth() - (Number(meses) || 0));
  return hoje.toISOString().slice(0, 10);
};

function carregarXLSX() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(window.XLSX); return; }
    const existing = document.getElementById("xlsx-script");
    if (existing) {
      existing.addEventListener("load", () => resolve(window.XLSX));
      existing.addEventListener("error", () => reject(new Error("Falha ao carregar biblioteca de exportação.")));
      return;
    }
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.id = "xlsx-script";
    script.onload = () => resolve(window.XLSX);
    script.onerror = () => reject(new Error("Falha ao carregar biblioteca de exportação."));
    document.head.appendChild(script);
  });
}

const formatPhoneBR = (raw) => {
  if (raw === null || raw === undefined || raw === "") return "";
  const s = String(raw).replace(/\D/g, "");
  if (!s) return "";
  if (s.startsWith("55") && s.length >= 12 && s.length <= 13) {
    const ddd = s.slice(2, 4);
    const rest = s.slice(4);
    if (rest.length === 9) return `(${ddd}) ${rest.slice(0, 5)}-${rest.slice(5)}`;
    if (rest.length === 8) return `(${ddd}) ${rest.slice(0, 4)}-${rest.slice(4)}`;
    return `+55 ${ddd} ${rest}`;
  }
  return `+${s}`;
};

const excelDateToISO = (v) => {
  if (v === null || v === undefined || v === "") return "";
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === "number") {
    const utcDays = Math.floor(v - 25569);
    const d = new Date(utcDays * 86400 * 1000);
    return isNaN(d) ? "" : d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
};

/* ---------------------------------------------------------
   Integração com Google Agenda (Google Calendar API)
   — sincronização automática de eventos da Agenda e follow-ups
--------------------------------------------------------- */
const GOOGLE_CALENDAR_SCOPE = "https://www.googleapis.com/auth/calendar.events";

const addMinutosISO = (dataHoraISO, minutos) => {
  const d = new Date(dataHoraISO);
  d.setMinutes(d.getMinutes() + minutos);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
};

const agendaEventoParaGoogle = (evento, pacienteNome) => {
  const hora = evento.hora || "09:00";
  const inicio = `${evento.data}T${hora}:00`;
  const fim = addMinutosISO(inicio, 50);
  return {
    summary: `${evento.tipo} — ${pacienteNome}`,
    description: [evento.obs, "Criado automaticamente pelo CRM da Bárbara Sales."].filter(Boolean).join("\n\n"),
    start: { dateTime: inicio, timeZone: "America/Sao_Paulo" },
    end: { dateTime: fim, timeZone: "America/Sao_Paulo" },
    reminders: { useDefault: false, overrides: [{ method: "popup", minutes: 60 }, { method: "popup", minutes: 24 * 60 }] }
  };
};

const followupParaGoogle = (followup, pacienteNome) => {
  const inicio = `${followup.prazo}T09:00:00`;
  const fim = `${followup.prazo}T09:15:00`;
  return {
    summary: `Follow-up: ${followup.titulo}`,
    description: [
      `Paciente: ${pacienteNome}`, `Tipo: ${followup.tipo}`, `Prioridade: ${followup.prioridade}`,
      `Responsável: ${followup.responsavel}`, "", "Criado automaticamente pelo CRM da Bárbara Sales."
    ].join("\n"),
    start: { dateTime: inicio, timeZone: "America/Sao_Paulo" },
    end: { dateTime: fim, timeZone: "America/Sao_Paulo" },
    reminders: { useDefault: false, overrides: [{ method: "popup", minutes: 60 }] }
  };
};

const mensagemErroGoogle = (status) => {
  if (status === 401) return "Conexão com o Google expirada — vá em Integrações e clique em \"Conectar com Google Agenda\" de novo.";
  return `Falha ao falar com o Google Agenda (código ${status}).`;
};

async function criarEventoGoogle(token, payload) {
  const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
    method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error(mensagemErroGoogle(res.status));
  return res.json();
}
async function atualizarEventoGoogle(token, eventId, payload) {
  const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
    method: "PATCH", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error(mensagemErroGoogle(res.status));
  return res.json();
}
async function excluirEventoGoogle(token, eventId) {
  const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
    method: "DELETE", headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok && res.status !== 410 && res.status !== 404) throw new Error(mensagemErroGoogle(res.status));
}

const maskTelefone = (v) => {
  const digits = v.replace(/\D/g, "").slice(0, 11);
  if (digits.length <= 2) return digits;
  if (digits.length <= 6) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
  if (digits.length <= 10) return `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
  return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
};

const linkWhatsApp = (telefone, mensagem) => {
  if (!telefone) return null;
  const digits = telefone.replace(/\D/g, "");
  if (!digits) return null;
  const comPais = telefone.trim().startsWith("+") ? digits : `55${digits}`;
  const texto = mensagem ? `?text=${encodeURIComponent(mensagem)}` : "";
  return `https://wa.me/${comPais}${texto}`;
};

const linkMapa = (endereco) => {
  if (!endereco || !endereco.trim()) return null;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(endereco)}`;
};

const gerarPagamentosHistorico = (acomp) => {
  if (!acomp || !acomp.consultasTotal || !acomp.dataInicio) return [];
  const valorParcela = Math.round((acomp.valor / acomp.consultasTotal) * 100) / 100;
  const inicio = new Date(acomp.dataInicio + "T00:00:00");
  const pagamentos = [];
  for (let i = 0; i < (acomp.consultasRealizadas || 0); i++) {
    const d = new Date(inicio);
    d.setMonth(d.getMonth() + i);
    pagamentos.push({ id: uid(), data: d.toISOString().slice(0, 10), valor: valorParcela, formaPagamento: acomp.formaPagamento, tipo: "parcela" });
  }
  return pagamentos;
};

const interpolarPercentil = (tipo, sexo, mesesDecimal) => {
  const tabela = REF_CRESCIMENTO[tipo][sexo === "M" ? "M" : "F"];
  const chaves = Object.keys(tabela).map(Number).sort((a, b) => a - b);
  const m = Math.max(chaves[0], Math.min(chaves[chaves.length - 1], mesesDecimal));
  let inf = chaves[0], sup = chaves[chaves.length - 1];
  for (let i = 0; i < chaves.length - 1; i++) {
    if (m >= chaves[i] && m <= chaves[i + 1]) { inf = chaves[i]; sup = chaves[i + 1]; break; }
  }
  if (inf === sup) return tabela[inf];
  const frac = (m - inf) / (sup - inf);
  const a = tabela[inf], b = tabela[sup];
  return [0, 1, 2].map((i) => Math.round((a[i] + (b[i] - a[i]) * frac) * 100) / 100);
};

const idadeEmMesesDecimal = (dataNascimento, dataReferencia) => {
  if (!dataNascimento) return null;
  const nasc = new Date(dataNascimento + "T00:00:00");
  const ref = new Date((dataReferencia || new Date().toISOString().slice(0, 10)) + "T00:00:00");
  const dias = (ref - nasc) / (1000 * 60 * 60 * 24);
  return dias / 30.4375;
};

function eventToRow(e) {
  return {
    id: e.id, paciente_id: e.pacienteId, data: e.data, hora: e.hora || "",
    tipo: e.tipo || "Consulta", status: e.status || "agendado", obs: e.obs || "",
    google_event_id: e.googleEventId || null
  };
}
function eventFromRow(r) {
  return {
    id: r.id, pacienteId: r.paciente_id, data: r.data, hora: r.hora || "",
    tipo: r.tipo || "Consulta", status: r.status || "agendado", obs: r.obs || "",
    googleEventId: r.google_event_id || undefined
  };
}
function followupToRow(f) {
  return {
    id: f.id, paciente_id: f.pacienteId, titulo: f.titulo, tipo: f.tipo || "",
    prioridade: f.prioridade || "media", prazo: f.prazo || null, coluna: f.coluna || "afazer",
    responsavel: f.responsavel || "Nutricionista", google_event_id: f.googleEventId || null
  };
}
function followupFromRow(r) {
  return {
    id: r.id, pacienteId: r.paciente_id, titulo: r.titulo, tipo: r.tipo || "",
    prioridade: r.prioridade || "media", prazo: r.prazo || "", coluna: r.coluna || "afazer",
    responsavel: r.responsavel || "Nutricionista", googleEventId: r.google_event_id || undefined
  };
}

/* ---------------------------------------------------------
   App principal
--------------------------------------------------------- */
function App() {
  const [patients, setPatients] = useState([]);
  const [followups, setFollowups] = useState([]);
  const [view, setView] = useState("dashboard");
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [filtroPacientesInicial, setFiltroPacientesInicial] = useState("todos");
  const [loaded, setLoaded] = useState(false);
  const [showNewPatient, setShowNewPatient] = useState(false);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [events, setEvents] = useState([]);

  useEffect(() => {
    if (query.trim() && view !== "patients") {
      setFiltroPacientesInicial("todos");
      setView("patients");
    }
  }, [query]);

  const [googleClientId, setGoogleClientId] = useState("");
  const [contratosModelo, setContratosModelo] = useState(CONTRATOS_PADRAO);
  const [googleToken, setGoogleToken] = useState(null);
  const [gisReady, setGisReady] = useState(false);
  const [syncLog, setSyncLog] = useState([]);
  const tokenClientRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const [pacientesRes, eventosRes, followupsRes, settingsRes] = await Promise.all([
          supabaseClient.from("patients").select("*"),
          supabaseClient.from("events").select("*"),
          supabaseClient.from("followups").select("*"),
          supabaseClient.from("app_settings").select("*")
        ]);
        setPatients((pacientesRes.data || []).map(patientFromRow));
        setEvents((eventosRes.data || []).map(eventFromRow));
        setFollowups((followupsRes.data || []).map(followupFromRow));
        const settingsMap = {};
        (settingsRes.data || []).forEach((s) => { settingsMap[s.chave] = s.valor; });
        setGoogleClientId(settingsMap.googleClientId || "");
        setContratosModelo(settingsMap.contratosModelo ? JSON.parse(settingsMap.contratosModelo) : CONTRATOS_PADRAO);
      } catch (e) {
        console.error("Falha ao carregar do Supabase:", e);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    supabaseClient.from("app_settings").upsert([
      { chave: "googleClientId", valor: googleClientId },
      { chave: "contratosModelo", valor: JSON.stringify(contratosModelo) }
    ]).then(() => {}).catch((e) => console.error("Falha ao salvar configurações:", e));
  }, [googleClientId, contratosModelo, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const hoje = new Date().toISOString().slice(0, 10);
    patients.forEach((p) => {
      if (p.status !== "prospect") return;
      const dias = diasDesde(p.ultimoContato);
      if (dias === null || dias < 30) return;
      const jaTem = followups.some((f) => f.pacienteId === p.id && f.coluna !== "concluido" && f.tipo === "Reativação de prospecção");
      if (jaTem) return;
      addFollowup({
        pacienteId: p.id,
        titulo: `Reativação — ${p.nome}`,
        tipo: "Reativação de prospecção",
        prioridade: "media",
        prazo: hoje,
        coluna: "afazer",
        responsavel: "Nutricionista"
      });
    });
  }, [loaded, patients]);

  useEffect(() => {
    if (!loaded) return;
    const hoje = new Date().toISOString().slice(0, 10);
    patients.forEach((p) => {
      if (p.status !== "ativo") return;
      if (!p.proximaConsultaPrevista) return;
      const diasAtraso = diasDesde(p.proximaConsultaPrevista);
      if (diasAtraso === null || diasAtraso < 7) return;
      const jaTem = followups.some((f) => f.pacienteId === p.id && f.coluna !== "concluido" && f.tipo === "Consulta atrasada");
      if (jaTem) return;
      addFollowup({
        pacienteId: p.id,
        titulo: `Consulta atrasada — ${p.nome}`,
        tipo: "Consulta atrasada",
        prioridade: "alta",
        prazo: hoje,
        coluna: "afazer",
        responsavel: "Nutricionista"
      });
    });
  }, [loaded, patients]);

  useEffect(() => {
    if (!googleClientId) return;
    if (window.google?.accounts?.oauth2) { setGisReady(true); return; }
    if (document.getElementById("gsi-client-script")) return;
    const script = document.createElement("script");
    script.src = "https://accounts.google.com/gsi/client";
    script.async = true;
    script.defer = true;
    script.id = "gsi-client-script";
    script.onload = () => setGisReady(true);
    document.head.appendChild(script);
  }, [googleClientId]);

  const logSync = (msg, ok = true) => {
    setSyncLog((prev) => [{ id: uid(), msg, ok, quando: new Date().toISOString() }, ...prev].slice(0, 30));
  };

  const conectarGoogle = () => {
    if (!gisReady || !googleClientId || !window.google) return;
    if (!tokenClientRef.current) {
      tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: googleClientId,
        scope: GOOGLE_CALENDAR_SCOPE,
        callback: (resp) => {
          if (resp && resp.access_token) {
            setGoogleToken(resp.access_token);
            logSync("Conectado à Google Agenda com sucesso.");
          } else {
            logSync("Não foi possível conectar à Google Agenda.", false);
          }
        }
      });
    }
    tokenClientRef.current.requestAccessToken({ prompt: "" });
  };

  const desconectarGoogle = () => {
    if (googleToken && window.google?.accounts?.oauth2) {
      window.google.accounts.oauth2.revoke(googleToken, () => {});
    }
    setGoogleToken(null);
    logSync("Desconectado da Google Agenda.");
  };

  const selectedPatient = useMemo(
    () => patients.find((p) => p.id === selectedId) || null,
    [patients, selectedId]
  );

  const filteredPatients = useMemo(() => {
    if (!query.trim()) return patients;
    const q = query.toLowerCase();
    return patients.filter((p) =>
      [p.nome, p.diagnostico, p.responsavel, p.telefone, ...(p.tags || [])]
        .join(" ").toLowerCase().includes(q)
    );
  }, [patients, query]);

  const updatePatient = (id, patch) => {
    setPatients((prev) => {
      const atualizado = prev.map((p) => (p.id === id ? { ...p, ...patch } : p));
      const pacienteAtualizado = atualizado.find((p) => p.id === id);
      if (pacienteAtualizado) {
        supabaseClient.from("patients").update(patientToRow(pacienteAtualizado)).eq("id", id)
          .then(() => {}).catch((e) => console.error("Falha ao salvar paciente:", e));
      }
      return atualizado;
    });
  };
  const addPatient = (patient) => {
    const novo = { ...patient, id: uid() };
    setPatients((prev) => [novo, ...prev]);
    supabaseClient.from("patients").insert(patientToRow(novo))
      .then(() => {}).catch((e) => console.error("Falha ao criar paciente:", e));
  };
  const nomeDoPaciente = (pacienteId) => patients.find((p) => p.id === pacienteId)?.nome || "Paciente";

  const persistirPaciente = (paciente) => {
    supabaseClient.from("patients").update(patientToRow(paciente)).eq("id", paciente.id)
      .then(() => {}).catch((e) => console.error("Falha ao salvar paciente:", e));
  };

  const mutarPaciente = (id, transformFn) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const atualizado = transformFn(p);
      persistirPaciente(atualizado);
      return atualizado;
    }));
  };

  const exportarPacientesExcel = async () => {
    try {
      const XLSXlib = await carregarXLSX();
      const linhas = patients.map((p) => ({
        Nome: p.nome, "Data de nascimento": p.dataNascimento || "", Idade: calcIdade(p.dataNascimento),
        Sexo: p.sexo === "F" ? "Feminino" : "Masculino", Status: STATUS_LABEL[p.status] || p.status,
        Responsável: p.responsavel, Telefone: p.telefone, WhatsApp: p.whatsapp, "E-mail": p.email, Endereço: p.endereco,
        Diagnóstico: p.diagnostico, Alergias: p.alergias, Medicamentos: p.medicamentos, Pediatra: p.pediatra,
        Tags: (p.tags || []).join(", "), "Tipo de acompanhamento": p.acompanhamento?.tipo || "",
        "Início do acompanhamento": p.acompanhamento?.dataInicio || "", "Fim previsto": p.acompanhamento?.dataFim || "",
        "Consultas realizadas": p.acompanhamento?.consultasRealizadas ?? "", "Consultas total": p.acompanhamento?.consultasTotal ?? "",
        "Valor do plano": p.acompanhamento?.valor || 0, "Último contato": p.ultimoContato || ""
      }));
      const ws = XLSXlib.utils.json_to_sheet(linhas);
      const wb = XLSXlib.utils.book_new();
      XLSXlib.utils.book_append_sheet(wb, ws, "Pacientes");
      const hoje = new Date().toISOString().slice(0, 10);
      XLSXlib.writeFile(wb, `pacientes_crm_barbara_${hoje}.xlsx`);
      logSync(`Exportação concluída: ${linhas.length} pacientes.`);
    } catch (err) {
      logSync(err.message, false);
    }
  };

  const importarPacientesExcel = async (file) => {
    try {
      const XLSXlib = await carregarXLSX();
      const buffer = await file.arrayBuffer();
      const wb = XLSXlib.read(buffer, { type: "array", cellDates: true });

      const novosPacientes = [];
      const novosEventos = [];
      const atualizacoes = [];

      const existentesPorTelefone = {};
      patients.forEach((p) => {
        const key = (p.telefone || "").replace(/\D/g, "");
        if (key) existentesPorTelefone[key] = p;
      });

      // Normaliza nomes de coluna (ignora maiúsculas/minúsculas, acentos e espaços
      // extras) pra planilha funcionar mesmo com pequenas variações no cabeçalho.
      const normalizarTexto = (s) =>
        String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
      const normalizarLinha = (row) => {
        const nova = {};
        Object.keys(row).forEach((k) => { nova[normalizarTexto(k)] = row[k]; });
        return nova;
      };
      const campo = (linhaNormalizada, ...chaves) => {
        for (const chave of chaves) {
          const v = linhaNormalizada[normalizarTexto(chave)];
          if (v !== undefined && v !== null && v !== "") return v;
        }
        return "";
      };

      // Detecta as abas de "pacientes ativos" e "prospecção" pelo CONTEÚDO das colunas,
      // não pelo nome da aba — assim funciona não importa como as abas estão nomeadas,
      // e junta várias abas de prospecção em uma lista só, se houver mais de uma.
      const linhasPacientes = [];
      const linhasProspeccao = [];
      for (const nomeAba of wb.SheetNames) {
        const planilha = wb.Sheets[nomeAba];
        const linhasBrutas = XLSXlib.utils.sheet_to_json(planilha, { defval: "" });
        if (!linhasBrutas.length) continue;
        const linhas = linhasBrutas.map(normalizarLinha);
        const colunas = Object.keys(linhas[0]);
        const ehPacientes = colunas.includes(normalizarTexto("Nome da criança")) && colunas.some((c) => c.includes("status do agendamento"));
        const ehProspeccao = colunas.some((c) => c.includes(normalizarTexto("Nome da criança (se souber)"))) || colunas.some((c) => c.includes("status da negociacao"));
        if (ehPacientes) linhasPacientes.push(...linhas);
        else if (ehProspeccao) linhasProspeccao.push(...linhas);
      }
      // Se a detecção por coluna não encontrou nada, tenta pelo nome da aba (comportamento antigo)
      if (linhasPacientes.length === 0 && linhasProspeccao.length === 0) {
        const sheetPacAntigo = wb.Sheets["Pacientes"] || wb.Sheets[wb.SheetNames[0]];
        const sheetProAntigo = wb.Sheets["Ainda não fecharam"];
        if (sheetPacAntigo) linhasPacientes.push(...XLSXlib.utils.sheet_to_json(sheetPacAntigo, { defval: "" }).map(normalizarLinha));
        if (sheetProAntigo) linhasProspeccao.push(...XLSXlib.utils.sheet_to_json(sheetProAntigo, { defval: "" }).map(normalizarLinha));
      }

      const parseIdadeTexto = (texto) => {
        if (!texto) return null;
        const t = String(texto);
        const anosMatch = t.match(/(\d+)\s*anos?/i);
        const mesesMatch = t.match(/(\d+)\s*mes(es)?/i);
        if (!anosMatch && !mesesMatch) return null;
        const anos = anosMatch ? parseInt(anosMatch[1], 10) : 0;
        const meses = mesesMatch ? parseInt(mesesMatch[1], 10) : 0;
        return dataNascimentoDeIdade(anos, meses);
      };

      {
        const rows = linhasPacientes;
        rows.forEach((row) => {
          const nomeRaw = String(campo(row, "Nome da criança")).trim();
          const mae = String(campo(row, "Nome da mãe/responsável")).trim();
          if (!nomeRaw && !mae) return;
          if (nomeRaw.toLowerCase().startsWith("ex:") || mae.toLowerCase().startsWith("ex:")) return;

          const telefoneRaw = campo(row, "Contato (WhatsApp)");
          const telefoneDigits = String(telefoneRaw || "").replace(/\D/g, "");
          const telefone = formatPhoneBR(telefoneRaw);
          const ultimoContato = excelDateToISO(campo(row, "Data da última consulta"));
          const proxima = excelDateToISO(campo(row, "Próxima consulta prevista"));
          const freq = campo(row, "Frequência de retorno (dias)");
          const statusAgendamento = String(campo(row, "Status do agendamento")).trim();
          const obs = String(campo(row, "Observações")).trim();
          const dataNascimento = parseIdadeTexto(campo(row, "Idade atualizada")) || parseIdadeTexto(campo(row, "Idade")) || "";
          const statusPaciente = /^alta$/i.test(statusAgendamento) ? "concluido" : "ativo";

          // Identifica o tipo de acompanhamento na seguinte ordem de confiança:
          // 1) a coluna "Acompanhamento" da planilha (a mais confiável — vem direto da nutricionista);
          // 2) a frequência de retorno (mapeamento definido pela nutricionista);
          // 3) palavras-chave nas observações, como último recurso.
          const acompanhamentoTexto = String(campo(row, "Acompanhamento")).trim();
          const mapaAcompanhamento = {
            "trilhar": "trilhar",
            "introducao alimentar": "introducao_alimentar",
            "prazer em comer": "prazer_em_comer",
            "consulta avulsa": "avulso",
            "avulso": "avulso",
            "alimente": "seletividade",
            "ali(mente)": "seletividade",
            "seletividade": "seletividade",
            "seletividade alimentar": "seletividade"
          };
          const acompanhamentoChave = normalizarTexto(acompanhamentoTexto);
          const freqNum = parseInt(freq, 10);
          let tipoIdInferido = "avulso";
          if (acompanhamentoChave && mapaAcompanhamento[acompanhamentoChave]) {
            tipoIdInferido = mapaAcompanhamento[acompanhamentoChave];
          } else if (freqNum === 7) tipoIdInferido = "seletividade";
          else if (freqNum === 15) tipoIdInferido = "trilhar";
          else if (freqNum === 30) tipoIdInferido = "prazer_em_comer";
          else if (freqNum === 90) tipoIdInferido = "introducao_alimentar";
          else if (/seletividade|ali\s*\(?mente\)?/i.test(obs)) tipoIdInferido = "seletividade";
          else if (/introdu[cç][aã]o alimentar/i.test(obs)) tipoIdInferido = "introducao_alimentar";
          else if (/trilhar/i.test(obs)) tipoIdInferido = "trilhar";
          else if (/prazer em comer/i.test(obs)) tipoIdInferido = "prazer_em_comer";
          const tipoInfoInferido = TIPOS_ACOMPANHAMENTO.find((t) => t.id === tipoIdInferido);
          const acompanhamentoNaoReconhecido =
            acompanhamentoTexto && acompanhamentoChave && !mapaAcompanhamento[acompanhamentoChave] ? acompanhamentoTexto : null;

          let nomes = [nomeRaw || (mae ? `Filho(a) de ${mae}` : "")];
          const m = nomeRaw.match(/^(.+?)\s+e\s+(.+)$/i);
          if (m && !nomeRaw.includes("(")) nomes = [m[1].trim(), m[2].trim()];

          nomes.forEach((nome) => {
            if (!nome) return;
            const tags = [];
            if (statusAgendamento === "Novo paciente") tags.push("Novo paciente");
            else if (statusAgendamento === "Retorno atrasado") tags.push("Retorno atrasado");
            else if (/avalia/i.test(statusAgendamento)) tags.push("Avaliação feita");
            if (/unimed|convênio|convenio/i.test(obs)) tags.push("Convênio");
            if (freq) tags.push(`Retorno a cada ${parseInt(freq, 10)}d`);
            if (acompanhamentoNaoReconhecido) tags.push(acompanhamentoNaoReconhecido);

            const existente = existentesPorTelefone[telefoneDigits];
            if (telefoneDigits && existente) {
              atualizacoes.push({
                id: existente.id,
                patch: {
                  ultimoContato: ultimoContato || existente.ultimoContato,
                  proximaConsultaPrevista: proxima || existente.proximaConsultaPrevista,
                  observacoes: obs || existente.observacoes,
                  status: statusPaciente === "concluido" ? "concluido" : existente.status,
                  tags: Array.from(new Set([...(existente.tags || []), ...tags])),
                  timeline: obs
                    ? [...(existente.timeline || []), { data: ultimoContato || new Date().toISOString().slice(0, 10), tipo: "nota", texto: obs }]
                    : existente.timeline
                }
              });
            } else {
              const novoPaciente = {
                id: uid(), nome, dataNascimento, sexo: "F", escola: "", diagnostico: "",
                alergias: "", medicamentos: "", pediatra: "", responsavel: mae,
                telefone, whatsapp: telefone, email: "", endereco: "", tags, status: statusPaciente,
                ultimoContato, proximaConsultaPrevista: proxima, observacoes: obs,
                pagamentos: [], evolucao: [], sessoes: [],
                timeline: obs ? [{ data: ultimoContato || new Date().toISOString().slice(0, 10), tipo: "nota", texto: obs }] : [],
                acompanhamento: {
                  tipoId: tipoIdInferido, tipo: tipoInfoInferido ? tipoInfoInferido.label : "Consulta avulsa",
                  dataInicio: ultimoContato, dataFim: "",
                  consultasTotal: tipoInfoInferido?.etapas?.length || 1, consultasRealizadas: 1,
                  valor: 0, formaPagamento: "Pix", parcelas: 1, status: statusPaciente
                }
              };
              novosPacientes.push(novoPaciente);
              if (telefoneDigits) existentesPorTelefone[telefoneDigits] = novoPaciente;
              if (proxima && statusPaciente === "ativo") {
                novosEventos.push({ id: uid(), pacienteId: novoPaciente.id, data: proxima, hora: "", tipo: "Retorno", status: "agendado", obs: "" });
              }
            }
          });
        });
      }

      {
        const rows = linhasProspeccao;
        rows.forEach((row) => {
          const mae = String(campo(row, "Nome da mãe/responsável")).trim();
          const filhoRaw = String(campo(row, "Nome da criança (se souber)")).trim();
          if (mae.toLowerCase().startsWith("ex:") || filhoRaw.toLowerCase().startsWith("ex:")) return;
          if (!mae && !filhoRaw) return;

          const telefoneRaw = campo(row, "Contato (WhatsApp)");
          const telefoneDigits = String(telefoneRaw || "").replace(/\D/g, "");
          if (telefoneDigits && existentesPorTelefone[telefoneDigits]) return;

          const telefone = formatPhoneBR(telefoneRaw);
          const ultimo = excelDateToISO(campo(row, "Data do último contato"));
          const statusNeg = String(campo(row, "Status da negociação")).trim();
          const obs = String(campo(row, "Observações (o que foi conversado / objeção)", "Observações")).trim();

          let idadeAnos = null;
          let filhoBase = filhoRaw;
          const mIdade = filhoRaw.match(/^(.*?)\s*\((\d+)\s*anos?\)\s*$/i);
          if (mIdade) { filhoBase = mIdade[1].trim(); idadeAnos = parseInt(mIdade[2], 10); }

          let nomes = [filhoBase || `Filho(a) de ${mae}`];
          const mMulti = filhoBase.match(/^(.+?)\s+e\s+(.+)$/i);
          if (mMulti && !filhoBase.includes("(")) nomes = [mMulti[1].trim(), mMulti[2].trim()];

          const tags = statusNeg ? [statusNeg] : [];

          nomes.forEach((nome) => {
            if (!nome) return;
            const dataNascimento = idadeAnos != null && nomes.length === 1 ? dataNascimentoDeIdade(idadeAnos, 0) : "";
            const novoProspecto = {
              id: uid(), nome, dataNascimento, sexo: "F", escola: "", diagnostico: "",
              alergias: "", medicamentos: "", pediatra: "", responsavel: mae,
              telefone, whatsapp: telefone, email: "", endereco: "", tags: [...tags], status: "prospect",
              ultimoContato: ultimo, pagamentos: [], evolucao: [], sessoes: [],
              timeline: obs ? [{ data: ultimo || new Date().toISOString().slice(0, 10), tipo: "nota", texto: obs }] : [],
              acompanhamento: {
                tipoId: "avulso", tipo: "Prospecção", dataInicio: "", dataFim: "",
                consultasTotal: 0, consultasRealizadas: 0, valor: 0, formaPagamento: "Pix", parcelas: 1, status: "prospect"
              }
            };
            novosPacientes.push(novoProspecto);
            if (telefoneDigits) existentesPorTelefone[telefoneDigits] = novoProspecto;
          });
        });
      }

      if (novosPacientes.length === 0 && atualizacoes.length === 0) {
        window.alert(
          "Nenhum paciente novo ou atualização encontrada. Confira se a planilha tem pelo menos uma aba com as colunas \"Nome da criança\" e \"Status do agendamento\" (pacientes) ou \"Nome da criança (se souber)\" / \"Status da negociação\" (prospecções) — não precisa ser o nome exato da aba, só as colunas."
        );
        return;
      }

      const qtdAtivos = novosPacientes.filter((p) => p.status === "ativo").length;
      const qtdProspeccao = novosPacientes.filter((p) => p.status === "prospect").length;
      const confirmar = window.confirm(
        `Foram encontrados:\n` +
        `• ${qtdAtivos} paciente(s) novo(s)\n` +
        `• ${qtdProspeccao} prospecção/ões nova(s)\n` +
        `• ${atualizacoes.length} paciente(s) existente(s) para atualizar (telefone já cadastrado)\n\n` +
        `Confirmar importação?`
      );
      if (!confirmar) return;

      if (novosPacientes.length > 0) {
        setPatients((prev) => [...prev, ...novosPacientes]);
        supabaseClient.from("patients").insert(novosPacientes.map(patientToRow))
          .then(() => {}).catch((e) => console.error("Falha ao importar pacientes:", e));
      }
      if (atualizacoes.length > 0) {
        setPatients((prev) => {
          const atualizado = prev.map((p) => {
            const upd = atualizacoes.find((a) => a.id === p.id);
            return upd ? { ...p, ...upd.patch } : p;
          });
          atualizacoes.forEach((a) => {
            const pacienteAtualizado = atualizado.find((p) => p.id === a.id);
            if (pacienteAtualizado) persistirPaciente(pacienteAtualizado);
          });
          return atualizado;
        });
      }
      if (novosEventos.length > 0) {
        setEvents((prev) => [...novosEventos, ...prev]);
        supabaseClient.from("events").insert(novosEventos.map(eventToRow))
          .then(() => {}).catch((e) => console.error("Falha ao importar eventos:", e));
      }

      logSync(`Importação concluída: ${novosPacientes.length} novo(s), ${atualizacoes.length} atualizado(s).`);
    } catch (err) {
      logSync(`Erro na importação: ${err.message}`, false);
    }
  };

  const deletePatient = (id) => {
    const eventosDoPaciente = events.filter((e) => e.pacienteId === id);
    const followupsDoPaciente = followups.filter((f) => f.pacienteId === id);
    if (googleToken) {
      eventosDoPaciente.forEach((e) => { if (e.googleEventId) excluirEventoGoogle(googleToken, e.googleEventId).catch(() => {}); });
      followupsDoPaciente.forEach((f) => { if (f.googleEventId) excluirEventoGoogle(googleToken, f.googleEventId).catch(() => {}); });
    }
    setEvents((prev) => prev.filter((e) => e.pacienteId !== id));
    setFollowups((prev) => prev.filter((f) => f.pacienteId !== id));
    setPatients((prev) => prev.filter((p) => p.id !== id));
    setSelectedId(null);
    // Eventos e follow-ups do paciente são removidos automaticamente no banco (cascade)
    supabaseClient.from("patients").delete().eq("id", id)
      .then(() => {}).catch((e) => console.error("Falha ao excluir paciente:", e));
    logSync("Paciente excluído do CRM.");
  };

  const moveFollowup = (id, coluna) => {
    setFollowups((prev) => prev.map((f) => (f.id === id ? { ...f, coluna } : f)));
    supabaseClient.from("followups").update({ coluna }).eq("id", id)
      .then(() => {}).catch((e) => console.error("Falha ao mover follow-up:", e));
    if (coluna === "concluido" && googleToken) {
      const followup = followups.find((f) => f.id === id);
      if (followup?.googleEventId) {
        excluirEventoGoogle(googleToken, followup.googleEventId)
          .then(() => logSync(`Follow-up concluído, removido do Google Agenda: ${followup.titulo}`))
          .catch((err) => logSync(err.message, false));
      }
    }
  };

  const addFollowup = (followup) => {
    const localId = uid();
    const novo = { ...followup, id: localId };
    setFollowups((prev) => [novo, ...prev]);
    supabaseClient.from("followups").insert(followupToRow(novo))
      .then(() => {}).catch((e) => console.error("Falha ao criar follow-up:", e));
    if (googleToken) {
      criarEventoGoogle(googleToken, followupParaGoogle(novo, nomeDoPaciente(novo.pacienteId)))
        .then((resultado) => {
          setFollowups((prev) => prev.map((f) => (f.id === localId ? { ...f, googleEventId: resultado.id } : f)));
          supabaseClient.from("followups").update({ google_event_id: resultado.id }).eq("id", localId).then(() => {}).catch(() => {});
          logSync(`Follow-up sincronizado: ${novo.titulo}`);
        })
        .catch((err) => logSync(err.message, false));
    }
  };

  const criarFollowupsProspeccao = () => {
    const daqui7dias = new Date();
    daqui7dias.setDate(daqui7dias.getDate() + 7);
    const prazo = daqui7dias.toISOString().slice(0, 10);
    const prospeccoes = patients.filter((p) => p.status === "prospect");
    const pendentes = prospeccoes.filter((p) => !followups.some((f) => f.pacienteId === p.id && f.coluna !== "concluido"));

    if (pendentes.length === 0) {
      logSync("Todas as prospecções já têm um follow-up pendente.");
      return;
    }
    const confirmar = window.confirm(
      `Serão criados ${pendentes.length} follow-up(s) novo(s), um para cada prospecção sem follow-up pendente, ` +
      `com prazo em ${formatData(prazo)}.\n\nConfirmar criação?`
    );
    if (!confirmar) return;

    let criados = 0;
    pendentes.forEach((p) => {
      addFollowup({
        pacienteId: p.id, titulo: `Follow-up de prospecção — ${p.nome}`, tipo: "Fazer follow-up",
        prioridade: "media", prazo, coluna: "afazer", responsavel: "Nutricionista"
      });
      criados++;
    });
    logSync(criados > 0 ? `${criados} follow-up(s) de prospecção criado(s) para ${formatData(prazo)}.` : "Todas as prospecções já têm um follow-up pendente.");
  };

  const deleteFollowup = (id) => {
    const followup = followups.find((f) => f.id === id);
    setFollowups((prev) => prev.filter((f) => f.id !== id));
    supabaseClient.from("followups").delete().eq("id", id)
      .then(() => {}).catch((e) => console.error("Falha ao excluir follow-up:", e));
    if (googleToken && followup?.googleEventId) {
      excluirEventoGoogle(googleToken, followup.googleEventId)
        .then(() => logSync("Follow-up removido do Google Agenda."))
        .catch((err) => logSync(err.message, false));
    }
  };

  const addEvent = (ev) => {
    const localId = uid();
    const novoEvento = { ...ev, id: localId };
    setEvents((prev) => [novoEvento, ...prev]);
    supabaseClient.from("events").insert(eventToRow(novoEvento))
      .then(() => {}).catch((e) => console.error("Falha ao criar evento:", e));
    if (googleToken) {
      criarEventoGoogle(googleToken, agendaEventoParaGoogle(novoEvento, nomeDoPaciente(novoEvento.pacienteId)))
        .then((resultado) => {
          setEvents((prev) => prev.map((e) => (e.id === localId ? { ...e, googleEventId: resultado.id } : e)));
          supabaseClient.from("events").update({ google_event_id: resultado.id }).eq("id", localId).then(() => {}).catch(() => {});
          logSync(`Evento sincronizado: ${novoEvento.tipo} — ${nomeDoPaciente(novoEvento.pacienteId)}`);
        })
        .catch((err) => logSync(err.message, false));
    }
  };

  const updateEvent = (id, patch) => {
    setEvents((prev) => {
      const atualizado = prev.map((e) => (e.id === id ? { ...e, ...patch } : e));
      const eventoAtualizado = atualizado.find((e) => e.id === id);
      if (eventoAtualizado) {
        supabaseClient.from("events").update(eventToRow(eventoAtualizado)).eq("id", id)
          .then(() => {}).catch((e) => console.error("Falha ao salvar evento:", e));
      }
      if (googleToken && eventoAtualizado?.googleEventId) {
        atualizarEventoGoogle(googleToken, eventoAtualizado.googleEventId, agendaEventoParaGoogle(eventoAtualizado, nomeDoPaciente(eventoAtualizado.pacienteId)))
          .then(() => logSync(`Evento atualizado no Google: ${eventoAtualizado.tipo} — ${nomeDoPaciente(eventoAtualizado.pacienteId)}`))
          .catch((err) => logSync(err.message, false));
      }
      return atualizado;
    });
  };

  const deleteEvent = (id) => {
    const evento = events.find((e) => e.id === id);
    setEvents((prev) => prev.filter((e) => e.id !== id));
    supabaseClient.from("events").delete().eq("id", id)
      .then(() => {}).catch((e) => console.error("Falha ao excluir evento:", e));
    if (googleToken && evento?.googleEventId) {
      excluirEventoGoogle(googleToken, evento.googleEventId)
        .then(() => logSync("Evento removido do Google Agenda."))
        .catch((err) => logSync(err.message, false));
    }
  };

  const sincronizarTudoComGoogle = async () => {
    if (!googleToken) return;
    logSync("Iniciando sincronização em massa...");
    let sucesso = 0;
    let falhas = 0;
    for (const ev of events) {
      if (ev.googleEventId || ev.status === "cancelado") continue;
      try {
        const resultado = await criarEventoGoogle(googleToken, agendaEventoParaGoogle(ev, nomeDoPaciente(ev.pacienteId)));
        setEvents((prev) => prev.map((e) => (e.id === ev.id ? { ...e, googleEventId: resultado.id } : e)));
        supabaseClient.from("events").update({ google_event_id: resultado.id }).eq("id", ev.id).then(() => {}).catch(() => {});
        sucesso++;
      } catch (err) { falhas++; }
    }
    for (const f of followups) {
      if (f.googleEventId || f.coluna === "concluido") continue;
      try {
        const resultado = await criarEventoGoogle(googleToken, followupParaGoogle(f, nomeDoPaciente(f.pacienteId)));
        setFollowups((prev) => prev.map((x) => (x.id === f.id ? { ...x, googleEventId: resultado.id } : x)));
        supabaseClient.from("followups").update({ google_event_id: resultado.id }).eq("id", f.id).then(() => {}).catch(() => {});
        sucesso++;
      } catch (err) { falhas++; }
    }
    logSync(`Sincronização em massa concluída: ${sucesso} enviados, ${falhas} falharam.`, falhas === 0);
  };

  const sugerirTiposAcompanhamento = () => {
    const calcIdadeAnos = (nasc) => {
      const n = new Date(nasc + "T00:00:00");
      const hoje = new Date();
      let anos = hoje.getFullYear() - n.getFullYear();
      const m = hoje.getMonth() - n.getMonth();
      if (m < 0 || (m === 0 && hoje.getDate() < n.getDate())) anos--;
      return anos;
    };

    const elegiveis = patients.filter(
      (p) =>
        p.status !== "prospect" &&
        p.status !== "concluido" &&
        p.dataNascimento &&
        (!p.acompanhamento?.tipoId || p.acompanhamento.tipoId === "avulso")
    );

    if (elegiveis.length === 0) {
      window.alert(
        "Nenhum paciente elegível encontrado. Isso funciona só para pacientes que já têm data de nascimento " +
        "preenchida e ainda não têm um tipo de acompanhamento definido."
      );
      return;
    }

    const confirmar = window.confirm(
      `Isso vai sugerir automaticamente o tipo de acompanhamento para ${elegiveis.length} paciente(s) com idade cadastrada, com base na idade:\n\n` +
      `• Menos de 1 ano → Introdução Alimentar\n` +
      `• 1 a 3 anos → Ali(mente)\n` +
      `• 4 anos ou mais → Trilhar\n\n` +
      `Pacientes que já têm um tipo definido não serão alterados. Confirmar?`
    );
    if (!confirmar) return;

    let atualizados = 0;
    setPatients((prev) =>
      prev.map((p) => {
        const elegivel = elegiveis.some((e) => e.id === p.id);
        if (!elegivel) return p;
        const idade = calcIdadeAnos(p.dataNascimento);
        const tipoId = idade < 1 ? "introducao_alimentar" : idade < 4 ? "seletividade" : "trilhar";
        const tipoInfo = TIPOS_ACOMPANHAMENTO.find((t) => t.id === tipoId);
        atualizados++;
        const atualizado = {
          ...p,
          acompanhamento: {
            ...p.acompanhamento,
            tipoId,
            tipo: tipoInfo.label,
            dataFim: addMesesData(
              p.acompanhamento?.dataInicio || p.ultimoContato || new Date().toISOString().slice(0, 10),
              tipoInfo.duracaoMeses
            ),
            consultasTotal: tipoInfo.etapas.length || p.acompanhamento?.consultasTotal || 1
          }
        };
        persistirPaciente(atualizado);
        return atualizado;
      })
    );
    const semIdade = patients.filter(
      (p) => p.status !== "prospect" && p.status !== "concluido" && !p.dataNascimento
    ).length;
    logSync(`${atualizados} paciente(s) classificado(s) automaticamente. ${semIdade} sem idade cadastrada (não foi possível sugerir).`);
  };

  const resetarBaseDados = () => {
    const confirmado = window.confirm(
      "Isso vai substituir todos os pacientes, agenda e follow-ups pelos dados originais deste arquivo, apagando qualquer edição feita depois da última atualização (novos pagamentos, consultas registradas, follow-ups criados, etc.). Deseja continuar?"
    );
    if (!confirmado) return;
    const p = seedPatients();
    setPatients(p);
    setFollowups(seedFollowups(p));
    setEvents(seedEvents(p));
    supabaseClient.from("events").delete().neq("id", "").then(() => {}).catch((e) => console.error("Falha ao limpar eventos:", e));
    supabaseClient.from("followups").delete().neq("id", "").then(() => {}).catch((e) => console.error("Falha ao limpar follow-ups:", e));
    supabaseClient.from("patients").delete().neq("id", "").then(() => {}).catch((e) => console.error("Falha ao limpar pacientes:", e));
    logSync("Base de dados recarregada a partir do arquivo.");
  };

  const registrarConsultaHoje = (id) => {
    const hoje = new Date().toISOString().slice(0, 10);
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const acomp = p.acompanhamento ? {
        ...p.acompanhamento,
        consultasRealizadas: Math.min((p.acompanhamento.consultasRealizadas || 0) + 1, p.acompanhamento.consultasTotal || (p.acompanhamento.consultasRealizadas || 0) + 1)
      } : p.acompanhamento;
      const atualizado = {
        ...p, ultimoContato: hoje, acompanhamento: acomp,
        timeline: [...(p.timeline || []), { data: hoje, tipo: "consulta", texto: "Consulta registrada rapidamente." }]
      };
      persistirPaciente(atualizado);
      return atualizado;
    }));
  };

  const addMedicao = (id, medicao) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const atualizado = {
        ...p,
        evolucao: [...(p.evolucao || []), medicao],
        timeline: [...(p.timeline || []), { data: medicao.data, tipo: "nota", texto: `Nova medição: ${medicao.peso}kg / ${medicao.altura}cm.` }]
      };
      persistirPaciente(atualizado);
      return atualizado;
    }));
  };

  const addPagamento = (id, pagamento) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const atualizado = {
        ...p,
        pagamentos: [...(p.pagamentos || []), pagamento],
        timeline: [...(p.timeline || []), { data: pagamento.data, tipo: "nota", texto: `Pagamento registrado: ${formatMoeda(pagamento.valor)} (${pagamento.formaPagamento}).` }]
      };
      persistirPaciente(atualizado);
      return atualizado;
    }));
  };

  const addSessao = (id, sessao) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const acomp = p.acompanhamento ? {
        ...p.acompanhamento,
        consultasRealizadas: Math.min((p.acompanhamento.consultasRealizadas || 0) + 1, p.acompanhamento.consultasTotal || (p.acompanhamento.consultasRealizadas || 0) + 1)
      } : p.acompanhamento;
      const atualizado = {
        ...p, ultimoContato: sessao.data, acompanhamento: acomp,
        sessoes: [...(p.sessoes || []), sessao],
        timeline: [...(p.timeline || []), { data: sessao.data, tipo: "consulta", texto: `${sessao.titulo} — ${sessao.notas || "sem observações"}` }]
      };
      persistirPaciente(atualizado);
      return atualizado;
    }));

    // Sincroniza a agenda: agenda automaticamente a próxima etapa pendente do plano,
    // se ainda não houver um agendamento futuro criado para esse paciente.
    const paciente = patients.find((p) => p.id === id);
    if (paciente?.acompanhamento?.tipoId) {
      const tipoInfo = TIPOS_ACOMPANHAMENTO.find((t) => t.id === paciente.acompanhamento.tipoId);
      const hoje = new Date().toISOString().slice(0, 10);
      const jaTemAgendamentoFuturo = events.some((e) => e.pacienteId === id && e.status === "agendado" && e.data >= hoje);
      if (tipoInfo && !jaTemAgendamentoFuturo) {
        const feitas = [...(paciente.sessoes || []).map((s) => s.titulo), sessao.titulo];
        const proximaEtapa = tipoInfo.etapas.find((e) => !feitas.includes(e.titulo));
        if (proximaEtapa) {
          const dataBase = paciente.acompanhamento.dataInicio || sessao.data;
          addEvent({
            pacienteId: id,
            data: addMesesData(dataBase, proximaEtapa.offsetMeses),
            hora: "",
            tipo: proximaEtapa.titulo,
            status: "agendado",
            obs: "Agendado automaticamente com base no plano de acompanhamento"
          });
        }
      }
    }
  };

  const setTipoAcompanhamento = (id, tipoId) => {
    mutarPaciente(id, (p) => {
      const tipoInfo = TIPOS_ACOMPANHAMENTO.find((t) => t.id === tipoId);
      const dataInicio = p.acompanhamento?.dataInicio || new Date().toISOString().slice(0, 10);
      const duracao = Math.max(tipoInfo?.duracaoMeses || 1, DURACAO_MINIMA_MESES);
      const dataFim = addMesesData(dataInicio, duracao);
      return {
        ...p,
        acompanhamento: {
          ...p.acompanhamento, tipoId, tipo: tipoInfo?.label || "Consulta avulsa",
          dataInicio, dataFim, consultasTotal: tipoInfo?.etapas?.length || p.acompanhamento?.consultasTotal || 1
        }
      };
    });
  };

  const setPlanoAcao = (id, planoAcao) => {
    mutarPaciente(id, (p) => ({ ...p, planoAcao }));
  };

  const addExame = (id, exame) => {
    mutarPaciente(id, (p) => ({ ...p, exames: [...(p.exames || []), exame] }));
  };

  const deleteExame = (id, exameId) => {
    mutarPaciente(id, (p) => ({ ...p, exames: (p.exames || []).filter((e) => e.id !== exameId) }));
  };

  const addMarcoAlimentar = (id, marco) => {
    mutarPaciente(id, (p) => ({ ...p, marcosAlimentares: [...(p.marcosAlimentares || []), marco] }));
  };

  const deleteMarcoAlimentar = (id, marcoId) => {
    mutarPaciente(id, (p) => ({ ...p, marcosAlimentares: (p.marcosAlimentares || []).filter((m) => m.id !== marcoId) }));
  };

  if (!loaded) {
    return <div style={{ ...styles.root, alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: "#6E6355", fontFamily: "Lato, sans-serif" }}>Carregando…</div>
    </div>;
  }

  return (
    <div style={styles.root}>
      <Sidebar
        view={view}
        setView={(v) => { setView(v); setMobileNavOpen(false); }}
        onNewPatient={() => { setShowNewPatient(true); setMobileNavOpen(false); }}
        mobileOpen={mobileNavOpen}
        onClose={() => setMobileNavOpen(false)}
      />
      {mobileNavOpen && (
        <div onClick={() => setMobileNavOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(134,122,110,0.35)", zIndex: 90 }} />
      )}
      <div style={styles.main}>
        <Header query={query} setQuery={setQuery} onMenuClick={() => setMobileNavOpen(true)} />
        <div style={styles.content} className="content">
          {view === "dashboard" && <Dashboard patients={patients} followups={followups} setView={setView} setSelectedId={setSelectedId} setFiltroPacientesInicial={setFiltroPacientesInicial} />}
          {view === "patients" && <PatientsList patients={filteredPatients} events={events} onOpen={(id) => setSelectedId(id)} onNew={() => setShowNewPatient(true)} onQuickConsulta={registrarConsultaHoje} onExportar={exportarPacientesExcel} onImportar={importarPacientesExcel} filtroInicial={filtroPacientesInicial} />}
          {view === "agenda" && <Agenda patients={patients} events={events} onAdd={addEvent} onUpdate={updateEvent} onDelete={deleteEvent} />}
          {view === "followups" && <FollowupsBoard followups={followups} patients={patients} onMove={moveFollowup} onAdd={addFollowup} onDelete={deleteFollowup} onCriarProspeccao={criarFollowupsProspeccao} />}
          {view === "financeiro" && <Financeiro patients={patients} onAddPagamento={addPagamento} />}
          {view === "administracao" && (
            <Administracao patients={patients} contratosModelo={contratosModelo} setContratosModelo={setContratosModelo} />
          )}
          {view === "integracoes" && (
            <Integracoes
              googleClientId={googleClientId}
              setGoogleClientId={setGoogleClientId}
              googleToken={googleToken}
              gisReady={gisReady}
              onConectar={conectarGoogle}
              onDesconectar={desconectarGoogle}
              onSincronizarTudo={sincronizarTudoComGoogle}
              syncLog={syncLog}
              onResetarBase={resetarBaseDados}
              onSugerirTipos={sugerirTiposAcompanhamento}
              patients={patients}
              followups={followups}
              events={events}
              setPatients={setPatients}
              setFollowups={setFollowups}
              setEvents={setEvents}
            />
          )}
        </div>
      </div>
      {selectedPatient && (
        <PatientDetail
          patient={selectedPatient}
          onClose={() => setSelectedId(null)}
          onUpdate={(patch) => updatePatient(selectedPatient.id, patch)}
          onQuickConsulta={() => registrarConsultaHoje(selectedPatient.id)}
          onAddMedicao={(m) => addMedicao(selectedPatient.id, m)}
          onAddPagamento={(pg) => addPagamento(selectedPatient.id, pg)}
          onAddSessao={(s) => addSessao(selectedPatient.id, s)}
          onSetTipoAcompanhamento={(tipoId) => setTipoAcompanhamento(selectedPatient.id, tipoId)}
          onDeletePatient={() => deletePatient(selectedPatient.id)}
          onSetPlanoAcao={(p) => setPlanoAcao(selectedPatient.id, p)}
          onAddExame={(e) => addExame(selectedPatient.id, e)}
          onDeleteExame={(eid) => deleteExame(selectedPatient.id, eid)}
          onAddMarcoAlimentar={(m) => addMarcoAlimentar(selectedPatient.id, m)}
          onDeleteMarcoAlimentar={(mid) => deleteMarcoAlimentar(selectedPatient.id, mid)}
        />
      )}
      {showNewPatient && (
        <NewPatientModal onClose={() => setShowNewPatient(false)} onSave={(p) => { addPatient(p); setShowNewPatient(false); }} />
      )}
    </div>
  );
}

function Sidebar({ view, setView, onNewPatient, mobileOpen, onClose }) {
  const items = [
    { id: "dashboard", label: "Painel", icon: LayoutDashboard },
    { id: "patients", label: "Prontuário", icon: Users },
    { id: "agenda", label: "Agenda", icon: CalendarIcon },
    { id: "followups", label: "Follow-up", icon: CheckSquare },
    { id: "financeiro", label: "Financeiro", icon: DollarSign },
    { id: "administracao", label: "Administração", icon: FileText },
    { id: "integracoes", label: "Integrações", icon: Settings }
  ];
  return (
    <div className={`sidebar${mobileOpen ? " mobile-open" : ""}`} style={styles.sidebar}>
      <div style={{ ...styles.logo, justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <GrowthMark />
          <div>
            <div style={{ fontFamily: "Playfair Display, serif", fontSize: 17, fontWeight: 600, color: "#867A6E" }}>
              Bárbara Sales
            </div>

/* ---------------------------------------------------------
   Dashboard
--------------------------------------------------------- */
function Dashboard({ patients, followups, setView, setSelectedId, setFiltroPacientesInicial }) {
  const [ordenacaoSemContato, setOrdenacaoSemContato] = useState("dias");
  const ativos = patients.filter((p) => p.status === "ativo").length;
  const pausa = patients.filter((p) => p.status === "pausa").length;
  const concluidos = patients.filter((p) => p.status === "concluido").length;
  const prospeccao = patients.filter((p) => p.status === "prospect").length;
  const totalConvertidos = ativos + pausa + concluidos;
  const taxaConversao = (totalConvertidos + prospeccao) > 0
    ? Math.round((totalConvertidos / (totalConvertidos + prospeccao)) * 100)
    : 0;

  const receitaPrevista = patients.reduce((s, p) => s + (p.acompanhamento?.valor || 0), 0);
  const receitaRecebida = patients.reduce((s, p) => {
    const a = p.acompanhamento;
    if (!a || !a.consultasTotal) return s;
    return s + (a.valor / a.consultasTotal) * a.consultasRealizadas;
  }, 0);
  const receitaPendente = receitaPrevista - receitaRecebida;

  const semContato = patients.filter((p) => {
    const d = diasDesde(p.ultimoContato);
    return d !== null && d >= 21 && p.status === "ativo";
  });

  const followupsPendentes = followups.filter((f) => f.coluna !== "concluido").length;

  const aniversariantes = patients.filter((p) => {
    if (!p.dataNascimento) return false;
    const n = new Date(p.dataNascimento);
    const hoje = new Date();
    const proximo = new Date(hoje.getFullYear(), n.getMonth(), n.getDate());
    const diff = (proximo - hoje) / (1000 * 60 * 60 * 24);
    return diff >= 0 && diff <= 7;
  });

  // Últimos 5 meses, calculados a partir de dados reais (não fictícios)
  const hoje0 = new Date();
  const meses5 = Array.from({ length: 5 }, (_, i) => {
    const d = new Date(hoje0.getFullYear(), hoje0.getMonth() - (4 - i), 1);
    return { y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString("pt-BR", { month: "short" }) };
  });

  const evolucaoPacientes = meses5.map(({ y, m, label }) => ({
    mes: label.charAt(0).toUpperCase() + label.slice(1),
    pacientes: patients.filter((p) => {
      if (!p.ultimoContato) return false;
      const d = new Date(p.ultimoContato + "T00:00:00");
      return d.getFullYear() === y && d.getMonth() === m;
    }).length
  }));

  const receitaMensal = meses5.map(({ y, m, label }) => ({
    mes: label.charAt(0).toUpperCase() + label.slice(1),
    valor: patients.reduce((s, p) => {
      const doMes = (p.pagamentos || []).filter((pg) => {
        const d = new Date(pg.data + "T00:00:00");
        return d.getFullYear() === y && d.getMonth() === m;
      });
      return s + doMes.reduce((s2, pg) => s2 + pg.valor, 0);
    }, 0)
  }));

  return (
    <div>
      <SectionTitle title="Painel" subtitle="Visão geral da clínica em tempo real" />

      <div style={styles.cardsGrid} className="cards-grid">
        <MetricCard label="Pacientes ativos" value={ativos} icon={Users} accent="#918567"
          onClick={() => { setFiltroPacientesInicial("ativo"); setView("patients"); }} />
        <MetricCard label="Inativos" value={pausa} icon={Clock} accent="#AFA998"
          onClick={() => { setFiltroPacientesInicial("pausa"); setView("patients"); }} />
        <MetricCard label="Receberam alta" value={concluidos} icon={CheckSquare} accent="#9C9284"
          onClick={() => { setFiltroPacientesInicial("concluido"); setView("patients"); }} />
        <MetricCard label="Em prospecção" value={prospeccao} icon={MessageCircle} accent="#A99790"
          onClick={() => { setFiltroPacientesInicial("prospect"); setView("patients"); }} />
        <MetricCard label="Taxa de conversão (geral)" value={`${taxaConversao}%`} icon={TrendingUp} accent="#918567" />
        <MetricCard label="Follow-ups pendentes" value={followupsPendentes} icon={MessageCircle} accent="#A99790"
          onClick={() => setView("followups")} />
        <MetricCard label="Receita prevista" value={formatMoeda(receitaPrevista)} icon={DollarSign} accent="#867A6E"
          onClick={() => setView("financeiro")} />
        <MetricCard label="Receita recebida" value={formatMoeda(receitaRecebida)} icon={TrendingUp} accent="#918567"
          onClick={() => setView("financeiro")} />
        <MetricCard label="Receita pendente" value={formatMoeda(receitaPendente)} icon={AlertTriangle} accent="#AFA998"
          onClick={() => setView("financeiro")} />
        <MetricCard label="Aniversariantes da semana" value={aniversariantes.length} icon={Cake} accent="#A99790" />
      </div>

      <div style={styles.chartsGrid} className="charts-grid">
        <div style={styles.panel}>
          <div style={styles.panelTitle}>Evolução do número de pacientes</div>
          <ResponsiveContainer width="100%" height={220}>
            <AreaChart data={evolucaoPacientes}>
              <defs>
                <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#918567" stopOpacity={0.35} />
                  <stop offset="100%" stopColor="#918567" stopOpacity={0} />
                </linearGradient>
              </defs>
              <CartesianGrid stroke="#E3DACB" vertical={false} />
              <XAxis dataKey="mes" tick={{ fontSize: 12, fill: "#9C9284" }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fontSize: 12, fill: "#9C9284" }} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{ borderRadius: 8, border: "1px solid #E3DACB", fontSize: 13 }} />
              <Area type="monotone" dataKey="pacientes" stroke="#918567" fill="url(#grad1)" strokeWidth={2.5} />
            </AreaChart>
          </ResponsiveContainer>
        </div>

        <div style={styles.panel}>
          <div style={styles.panelTitle}>Receita mensal</div>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={receitaMensal}>
              <CartesianGrid stroke="#E3DACB" vertical={false} />
              <XAxis dataKey="mes" tick={{ fontSize: 12, fill: "#9C9284" }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fontSize: 12, fill: "#9C9284" }} axisLine={false} tickLine={false}
                tickFormatter={(v) => `${v / 1000}k`} />
              <Tooltip formatter={(v) => formatMoeda(v)} contentStyle={{ borderRadius: 8, border: "1px solid #E3DACB", fontSize: 13 }} />
              <Bar dataKey="valor" fill="#867A6E" radius={[6, 6, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>Aniversariantes da semana</div>
        {aniversariantes.length === 0 ? (
          <div style={styles.emptyRow}>Nenhum aniversário nos próximos 7 dias.</div>
        ) : (
          aniversariantes.map((p) => (
            <div key={p.id} style={styles.riskRow}>
              <div onClick={() => setSelectedId(p.id)} style={{ cursor: "pointer", flex: 1 }}>
                <div style={{ fontWeight: 600, color: "#867A6E" }}>{p.nome}</div>
                <div style={{ fontSize: 12, color: "#9C9284" }}>{p.responsavel}</div>
              </div>
              {linkWhatsApp(p.whatsapp || p.telefone) && (
                <a
                  href={linkWhatsApp(p.whatsapp || p.telefone, `Olá, ${p.responsavel || ""}! Passando para desejar um feliz aniversário para a ${p.nome}! 🎂`)}
                  target="_blank" rel="noopener noreferrer"
                  style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#918567", fontWeight: 600, textDecoration: "none" }}
                >
                  <Cake size={14} /> Parabenizar
                </a>
              )}
            </div>
          ))
        )}
      </div>

      <div style={styles.panel}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
          <div style={styles.panelTitle}>Pacientes sem contato há 21+ dias</div>
          {semContato.length > 0 && (
            <div style={{ display: "flex", gap: 6 }}>
              {[
                { id: "dias", label: "Mais tempo sem contato" },
                { id: "nome", label: "Ordem alfabética" }
              ].map((o) => (
                <button
                  key={o.id}
                  onClick={() => setOrdenacaoSemContato(o.id)}
                  style={{
                    padding: "4px 10px", borderRadius: 20, fontSize: 11.5, fontWeight: 600, cursor: "pointer",
                    border: `1px solid ${ordenacaoSemContato === o.id ? "#918567" : "#E3DACB"}`,
                    background: ordenacaoSemContato === o.id ? "#EFE6D8" : "#FFFFFF",
                    color: ordenacaoSemContato === o.id ? "#867A6E" : "#9C9284"
                  }}
                >
                  {o.label}
                </button>
              ))}
            </div>
          )}
        </div>
        {semContato.length === 0 ? (
          <div style={styles.emptyRow}>Nenhum paciente ativo nessa situação. Tudo em dia.</div>
        ) : (
          [...semContato]
            .sort((a, b) =>
              ordenacaoSemContato === "nome"
                ? (a.nome || "").localeCompare(b.nome || "", "pt-BR")
                : diasDesde(b.ultimoContato) - diasDesde(a.ultimoContato)
            )
            .map((p) => (
              <div key={p.id} style={styles.riskRow} onClick={() => setSelectedId(p.id)}>
                <div>
                  <div style={{ fontWeight: 600, color: "#867A6E" }}>{p.nome}</div>
                  <div style={{ fontSize: 12, color: "#9C9284" }}>{p.diagnostico}</div>
                </div>
                <div style={{ fontSize: 12, color: "#A99790", fontWeight: 600 }}>
                  {diasDesde(p.ultimoContato)} dias sem contato
                </div>
              </div>
            ))
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Lista de pacientes
--------------------------------------------------------- */
function PatientsList({ patients, events, onOpen, onNew, onQuickConsulta, onExportar, onImportar, filtroInicial }) {
  const fileInputRef = useRef(null);
  const [filtroStatus, setFiltroStatus] = useState(filtroInicial || "todos");
  const [ordenacao, setOrdenacao] = useState("nome");
  const [limite, setLimite] = useState(30);

  useEffect(() => { setLimite(30); }, [patients.length, filtroStatus]);

  const contagens = {
    todos: patients.length,
    ativo: patients.filter((p) => p.status === "ativo").length,
    pausa: patients.filter((p) => p.status === "pausa").length,
    concluido: patients.filter((p) => p.status === "concluido").length,
    prospect: patients.filter((p) => p.status === "prospect").length
  };
  const FILTROS = [
    { id: "todos", label: "Todos" },
    { id: "ativo", label: "Ativos" },
    { id: "pausa", label: "Inativos" },
    { id: "concluido", label: "Receberam alta" },
    { id: "prospect", label: "Prospecção" }
  ];
  const filtradosBrutos = filtroStatus === "todos" ? patients : patients.filter((p) => p.status === filtroStatus);

  const proximoAtendimentoPorPaciente = useMemo(() => {
    const mapa = {};
    const hoje = new Date().toISOString().slice(0, 10);
    (events || []).forEach((e) => {
      if (e.status !== "agendado" || !e.data || e.data < hoje) return;
      if (!mapa[e.pacienteId] || e.data < mapa[e.pacienteId]) mapa[e.pacienteId] = e.data;
    });
    return mapa;
  }, [events]);

  const filtrados = useMemo(() => {
    const arr = [...filtradosBrutos];
    if (ordenacao === "proximo") {
      arr.sort((a, b) => {
        const da = proximoAtendimentoPorPaciente[a.id] || "9999-99-99";
        const db = proximoAtendimentoPorPaciente[b.id] || "9999-99-99";
        if (da !== db) return da.localeCompare(db);
        return (a.nome || "").localeCompare(b.nome || "", "pt-BR");
      });
    } else {
      arr.sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
    }
    return arr;
  }, [filtradosBrutos, ordenacao, proximoAtendimentoPorPaciente]);

  const visiveis = filtrados.slice(0, limite);

  return (
    <div>
      <SectionTitle
        title="Prontuário"
        subtitle={`${patients.length} pacientes encontrados`}
        action={
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              type="file"
              accept=".xlsx,.xls"
              ref={fileInputRef}
              style={{ display: "none" }}
              onChange={(e) => {
                const file = e.target.files[0];
                if (file) onImportar(file);
                e.target.value = "";
              }}
            />
            <button style={styles.secondaryBtn} onClick={() => fileInputRef.current.click()}>
              <Upload size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Importar Excel
            </button>
            <button style={styles.secondaryBtn} onClick={onExportar}>
              <FileText size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Exportar Excel
            </button>
            <button style={styles.primaryBtn} onClick={onNew}>
              <Plus size={16} /> Novo paciente
            </button>
          </div>
        }
      />
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        {FILTROS.map((f) => (
          <button
            key={f.id}
            onClick={() => setFiltroStatus(f.id)}
            style={{
              padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${filtroStatus === f.id ? "#867A6E" : "#E3DACB"}`,
              background: filtroStatus === f.id ? "#867A6E" : "#FFFFFF",
              color: filtroStatus === f.id ? "#FFFFFF" : "#6E6355"
            }}
          >
            {f.label} ({contagens[f.id]})
          </button>
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        <span style={{ fontSize: 12, color: "#9C9284", fontWeight: 600 }}>Ordenar por:</span>
        {[
          { id: "nome", label: "Ordem alfabética" },
          { id: "proximo", label: "Próximo atendimento" }
        ].map((o) => (
          <button
            key={o.id}
            onClick={() => setOrdenacao(o.id)}
            style={{
              padding: "5px 12px", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${ordenacao === o.id ? "#918567" : "#E3DACB"}`,
              background: ordenacao === o.id ? "#EFE6D8" : "#FFFFFF",
              color: ordenacao === o.id ? "#867A6E" : "#9C9284"
            }}
          >
            {o.label}
          </button>
        ))}
      </div>
      <div style={styles.panel}>
        <div style={styles.tableHeader} className="table-header">
          <div style={{ flex: 2 }}>Paciente</div>
          <div style={{ flex: 1.4 }}>Diagnóstico</div>
          <div style={{ flex: 1 }}>Responsável</div>
          <div style={{ flex: 1 }}>Status</div>
          <div style={{ flex: 1 }}>Acompanhamento</div>
          <div style={{ width: 36 }} />
          <div style={{ width: 36 }} />
          <div style={{ width: 24 }} />
        </div>
        {visiveis.map((p) => (
          <div key={p.id} style={styles.tableRow} className="table-row" onClick={() => onOpen(p.id)}>
            <div style={{ flex: 2 }}>
              <div style={{ fontWeight: 600, color: "#867A6E" }}>{p.nome}</div>
              <div style={{ fontSize: 12, color: "#9C9284" }}>{calcIdade(p.dataNascimento)}</div>
            </div>
            <div style={{ flex: 1.4, fontSize: 13, color: "#6E6355" }} data-label="Diagnóstico">
              {p.status === "prospect" ? (p.statusNegociacao || p.tags?.[0] || "—") : p.diagnostico}
            </div>
            <div style={{ flex: 1, fontSize: 13, color: "#6E6355" }} data-label="Responsável">{p.responsavel}</div>
            <div style={{ flex: 1 }} data-label="Status">
              <StatusPill status={p.status} />
            </div>
            <div style={{ flex: 1, fontSize: 13, color: "#6E6355" }} data-label="Acompanhamento">
              {p.acompanhamento?.consultasRealizadas}/{p.acompanhamento?.consultasTotal} · {p.acompanhamento?.tipo}
            </div>
            <div style={{ width: 36 }} onClick={(e) => e.stopPropagation()}>
              {linkWhatsApp(p.whatsapp || p.telefone) && (
                <a
                  href={linkWhatsApp(p.whatsapp || p.telefone, `Olá, ${p.responsavel || ""}! Aqui é a Bárbara, nutricionista da ${p.nome}.`)}
                  target="_blank" rel="noopener noreferrer" title="Abrir WhatsApp"
                  style={{
                    background: "#EFE6D8", borderRadius: 8, padding: 6,
                    display: "flex", color: "#867A6E", cursor: "pointer", width: "fit-content"
                  }}
                >
                  <MessageCircle size={15} />
                </a>
              )}
            </div>
            <div style={{ width: 36 }} onClick={(e) => e.stopPropagation()}>
              {p.status !== "concluido" && p.status !== "prospect" && (
                <button
                  title="Registrar consulta hoje"
                  onClick={() => onQuickConsulta(p.id)}
                  style={{
                    background: "#EFE6D8", border: "none", borderRadius: 8, padding: 6,
                    display: "flex", color: "#918567", cursor: "pointer"
                  }}
                >
                  <CheckCircle2 size={15} />
                </button>
              )}
            </div>
            <div className="chevron-col" style={{ width: 24, color: "#9C9284" }}><ChevronRight size={16} /></div>
          </div>
        ))}
        {visiveis.length === 0 && <div style={styles.emptyRow}>Nenhum paciente encontrado para esse filtro.</div>}
      </div>
      {filtrados.length > visiveis.length && (
        <div style={{ display: "flex", justifyContent: "center", marginTop: 16 }}>
          <button style={styles.secondaryBtn} onClick={() => setLimite((l) => l + 30)}>
            Carregar mais ({filtrados.length - visiveis.length} restantes)
          </button>
        </div>
      )}
    </div>
  );
}

  return (

  }));

  const dadosCurva = patient.dataNascimento

        const idadeAtual = idadeEmMesesDecimal(patient.dataNascimento);
        const idadeMaxima = Math.max(6, Math.min(60, Math.ceil(idadeAtual) + 3));
        return Array.from({ length: idadeMaxima + 1 }, (_, m) => {
          const [p3, p50, p97] = interpolarPercentil(curvaTipo, patient.sexo, m);
          const medicaoNoMes = (patient.evolucao || []).find((e) => {
            const idadeNaMedicao = idadeEmMesesDecimal(patient.dataNascimento, e.data);
            return idadeNaMedicao !== null && Math.round(idadeNaMedicao) === m;
          });
          return {
            mes: m,
            p3, p50, p97,
            paciente: medicaoNoMes ? (curvaTipo === "peso" ? medicaoNoMes.peso : medicaoNoMes.altura) : undefined

    : [];

  const salvarMedicao = () => {
    if (!medicao.peso || !medicao.altura) return;
    onAddMedicao({
      data: medicao.data,
      peso: Number(medicao.peso),
      altura: Number(medicao.altura),
      obs: medicao.obs

      consultasTotal: patient.acompanhamento?.consultasTotal || 1,

                <Field

              <div style={styles.divider} />
              <div style={styles.miniTitle}>Status do acompanhamento</div>
              <StatusPill status={patient.status} />
              <div style={{ marginTop: 14 }}>
                <button style={styles.primaryBtn} onClick={() => setShowPayment(true)}>
                  <DollarSign size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Registrar pagamento
                </button>
              </div>
              {patient.pagamentos && patient.pagamentos.length > 0 && (
                <>
                  <div style={styles.divider} />
                  <div style={styles.miniTitle}>Histórico de pagamentos</div>
                  {patient.pagamentos.slice().reverse().map((pg) => (
                    <div key={pg.id} style={styles.evoRow} className="evo-row">
                      <div style={{ fontSize: 12, color: "#9C9284", width: 90 }}>{formatData(pg.data)}</div>
                      <div style={{ fontSize: 13, color: "#867A6E", fontWeight: 600, width: 100 }}>{formatMoeda(pg.valor)}</div>
                      <div style={{ fontSize: 13, color: "#6E6355" }}>
                        {pg.formaPagamento}{pg.tipo === "avulso" ? " · Avulso" : ""}

                  ))}
                </>
              )}
            </div>
          )}
        </div>
      </div>
    </div>

      {showPayment && (
        <PaymentModal
          patients={[patient]}
          target={{ patientId: patient.id, mode: "parcela" }}
          onClose={() => setShowPayment(false)}
          onSave={(patientId, pagamento) => {
            onAddPagamento(pagamento);

          }}

      )}
    </>
  );
}

        <div key={label}>

function NewPatientModal({ onClose, onSave }) {
  const [form, setForm] = useState({
    nome: "", dataNascimento: "", sexo: "F", escola: "", diagnostico: "",
    alergias: "", medicamentos: "", pediatra: "", responsavel: "",
    telefone: "", whatsapp: "", email: "", endereco: "", tags: "", origem: "",
    dificuldadeAlimentar: "", corFavorita: "", personagensFavoritos: "", observacoes: "",
    status: "ativo", ultimoContato: new Date().toISOString().slice(0, 10)
  });
  const [whatsappIgual, setWhatsappIgual] = useState(true);
  const [showMais, setShowMais] = useState(false);
  const [erro, setErro] = useState("");
  const [idadeAnos, setIdadeAnos] = useState("");
  const [idadeMeses, setIdadeMeses] = useState("");

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const setIdade = (anos, meses) => {
    setIdadeAnos(anos);
    setIdadeMeses(meses);
    if (anos !== "" || meses !== "") {
      set("dataNascimento", dataNascimentoDeIdade(anos || 0, meses || 0));
    }
  };

  const setTelefone = (v) => {
    const formatted = maskTelefone(v);
    setForm((f) => ({ ...f, telefone: formatted, whatsapp: whatsappIgual ? formatted : f.whatsapp }));
  };

  const submit = () => {
    if (!form.nome.trim()) {
      setErro("Informe o nome da criança para salvar.");
      return;
    }
    onSave({
      ...form,
      whatsapp: whatsappIgual ? form.telefone : form.whatsapp,
      tags: form.tags.split(",").map((t) => t.trim()).filter(Boolean),
      pagamentos: [],
      evolucao: [],
      sessoes: [],
      timeline: [{ data: new Date().toISOString().slice(0, 10), tipo: "nota", texto: "Paciente cadastrado no sistema." }],
      acompanhamento: {
        tipoId: "avulso", tipo: "Consulta avulsa", dataInicio: new Date().toISOString().slice(0, 10),
        dataFim: "", consultasTotal: 1, consultasRealizadas: 0, valor: 0,
        formaPagamento: "Pix", parcelas: 1, status: "ativo"
      }
    });
  };

  return (
    <div style={styles.overlay} onClick={onClose}>
      <div style={styles.modal} className="modal" onClick={(e) => e.stopPropagation()}>
        <div style={styles.drawerHeader} className="drawer-header">
          <div style={{ fontFamily: "Playfair Display, serif", fontSize: 20, fontWeight: 600, color: "#867A6E" }}>
            Novo paciente
          </div>
          <button style={styles.iconBtn} onClick={onClose}><X size={18} /></button>
        </div>
        <div className="new-patient-grid" style={{ padding: 24, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, overflowY: "auto" }}>
